/* =========================================================
   Sambungan ke backend (FastAPI). Kalau file dibuka langsung tanpa
   server, aplikasi tetap berjalan sebagai prototipe dengan data contoh.
   ========================================================= */
const API = { enabled: false, ai: false, demo: false, token: null };
const storage = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { /* mode privat */ } },
};
async function api(path, { method = 'GET', body, form } = {}) {
  const headers = {};
  if (API.token) headers.Authorization = `Bearer ${API.token}`;
  let payload;
  if (form) payload = form;
  else if (body !== undefined) { headers['Content-Type'] = 'application/json'; payload = JSON.stringify(body); }
  let res;
  try { res = await fetch('/api' + path, { method, headers, body: payload }); }
  catch (e) { const err = new Error('Tidak tersambung ke server. Periksa internet.'); err.code = 'offline'; throw err; }
  let data = null;
  try { data = await res.json(); } catch (e) { /* bukan JSON */ }
  if (!res.ok) {
    const d = data && data.detail;
    const err = new Error(d && d.message ? d.message : Array.isArray(d) ? 'Isian belum lengkap atau tidak valid.' : 'Server sedang bermasalah.');
    err.status = res.status; err.code = d && d.code;
    throw err;
  }
  return data;
}
async function detectBackend() {
  if (!/^https?:$/.test(location.protocol)) return false;
  try {
    const res = await fetch('/api/health');
    if (!res.ok) return false;
    const h = await res.json();
    Object.assign(API, { enabled: true, ai: !!h.ai, demo: !!h.demo });
    return true;
  } catch (e) { return false; }
}
// Perkecil foto sebelum dikirim ke AI (foto HP bisa > 5 MB); gambar contoh yang kecil diperbesar
function imageToJpeg(src, max = 1600) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const big = Math.max(img.naturalWidth, img.naturalHeight);
      const scale = img.naturalWidth < 600 ? 2.5 : Math.min(1, max / big);
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? resolve(b) : reject(new Error('Foto tidak bisa diproses')), 'image/jpeg', 0.85);
    };
    img.onerror = () => reject(new Error('Foto tidak bisa dibuka'));
    img.src = src;
  });
}

/* Stok bahan */
const UNIT_ALIAS = { kilo: 'kg', kg: 'kg', liter: 'liter', lt: 'liter', l: 'liter', tabung: 'tabung', pak: 'pak', bal: 'bal',
  bungkus: 'bungkus', bks: 'bungkus', pcs: 'buah', buah: 'buah', biji: 'buah', ons: 'ons', gram: 'gram', gr: 'gram', g: 'gram',
  botol: 'botol', dus: 'dus', ikat: 'ikat', porsi: 'porsi', gelas: 'gelas', tusuk: 'tusuk', plastik: 'plastik' };
const RE_QTY = /(\d+(?:[.,]\d+)?)\s*(kilo|kg|liter|lt|l|tabung|pak|bal|bungkus|bks|pcs|buah|biji|ons|gram|gr|g|botol|dus|ikat)(?![a-z])/;
// Berapa yang masuk ke stok. Bahan per kg/liter memakai ukuran ("tepung 5 kg"),
// bahan per tabung/pak memakai jumlah barang ("gas elpiji 3 kg" = 1 tabung).
function stockQtyFor(s, size, sizeUnit, count) {
  const mass = { kg: 1000, ons: 100, gram: 1 };
  if (sizeUnit && sizeUnit === s.unit) return size * (count || 1);
  if (sizeUnit && mass[sizeUnit] && mass[s.unit]) return size * mass[sizeUnit] / mass[s.unit] * (count || 1);
  if (mass[s.unit] || s.unit === 'liter') return null;     // ukurannya tidak jelas: biar pemilik isi sendiri
  return count || (sizeUnit ? 1 : size) || 1;
}

/* =========================================================
   "AI" tiruan: aturan sederhana untuk membaca pesan
   ========================================================= */
const RE_IN = /(jual|laku|laris)/;
const RE_OUT = /(beli|bayar|belanja)/;
const RE_AMOUNT = /(rp\.?\s*)?(\d+(?:[.,]\d+)*)\s*(ribu|rbu|rb|k|juta|jt)?(?![a-z0-9])/gi;
const CAT_RULES_OUT = [
  [/(tepung|tapioka|aci|terigu|daging|ayam|ikan|telur|bumbu|cabai|cabe|bawang|kacang|kecap|saus|minyak|gula|garam|beras|sayur|teh|es batu|bahan)/, 'Bahan baku'],
  [/(gas|elpiji|lpg|listrik|token|pdam|air|plastik|kantong|tusuk|kemasan|mika|bensin|bbm|ongkir|ojek|parkir|sabun|kertas|tinta)/, 'Operasional'],
  [/(gaji|upah|karyawan|pegawai)/, 'Gaji'],
  [/(sewa|kontrak|lapak)/, 'Sewa'],
];

function detectType(t) {
  const a = t.search(RE_IN), b = t.search(RE_OUT);
  if (a < 0 && b < 0) return null;
  if (a < 0) return 'keluar';
  if (b < 0) return 'masuk';
  return a < b ? 'masuk' : 'keluar';
}

function findAmount(t) {
  let best = null;
  for (const m of t.matchAll(RE_AMOUNT)) {
    const [whole, rp, numStr, suf] = m;
    let val = null;
    if (suf) {
      const isDecimal = /^\d+[.,]\d{1,2}$/.test(numStr);
      const n = isDecimal ? parseFloat(numStr.replace(',', '.')) : Number(numStr.replace(/[.,]/g, ''));
      val = n * (/^(ribu|rbu|rb|k)$/i.test(suf) ? 1000 : 1000000);
    } else {
      const plain = Number(numStr.replace(/[.,]/g, ''));
      if (rp || /[.,]\d{3}/.test(numStr) || plain >= 1000) val = plain;
    }
    if (val) best = { value: Math.round(val), index: m.index, length: whole.length };
  }
  return best;
}

function guessCategory(type, text, cats) {
  let c;
  if (type === 'masuk') c = /(pesanan|pesan|order|katering|arisan|hajatan)/.test(text) ? 'Pesanan' : 'Penjualan';
  else c = (CAT_RULES_OUT.find(([re]) => re.test(text)) || [null, 'Lain-lain'])[1];
  const list = cats[type];
  return list.includes(c) ? c : (list.includes('Lain-lain') ? 'Lain-lain' : list[0]);
}

// Ubah angka berbentuk kata (hasil input suara) jadi angka: "lima puluh ribu" -> "50000"
const NUM_WORDS = { nol: 0, satu: 1, dua: 2, tiga: 3, empat: 4, lima: 5, enam: 6, tujuh: 7, delapan: 8, sembilan: 9,
  sepuluh: 10, sebelas: 11, seratus: 100, seribu: 1000, sejuta: 1000000, setengah: 0.5 };
function normalizeNumberWords(text) {
  const tokens = text.split(/\s+/), out = [];
  const word = tok => tok.replace(/[^a-z]/g, '');
  let i = 0;
  while (i < tokens.length) {
    if (!(word(tokens[i]) in NUM_WORDS)) { out.push(tokens[i]); i++; continue; }
    let total = 0, cur = 0, last = 0, trail = '', j = i;
    for (; j < tokens.length; j++) {
      const x = word(tokens[j]);
      if (x in NUM_WORDS) {
        const v = NUM_WORDS[x];
        if (v >= 1000) { total += (cur || 1) * v; cur = 0; last = 0; } else { cur += v; last = v; }
      } else if (x === 'belas') { cur += 10; last += 10; }
      else if (x === 'puluh' || x === 'ratus') { const k = x === 'puluh' ? 10 : 100; cur = cur - last + last * k; last = 0; }
      else if (x === 'ribu' || x === 'juta') { total += (cur || 1) * (x === 'ribu' ? 1000 : 1000000); cur = 0; last = 0; }
      else break;
      trail = tokens[j].replace(/^[a-z]+/, '');
    }
    out.push(String(total + cur) + trail);
    i = j;
  }
  return out.join(' ');
}

function parseMessage(raw, cats) {
  const t = normalizeNumberWords(raw.toLowerCase().replace(/\s+/g, ' ').trim());
  const type = detectType(t);
  const amt = findAmount(t);

  // tanggal
  let date = todayKey();
  const ago = t.match(/(\d+)\s*hari\s*(yang\s*)?lalu/);
  if (/kemarin/.test(t)) date = addDays(date, -1);
  else if (ago) date = addDays(date, -Number(ago[1]));

  // nama barang = sisa kalimat
  let rest = amt ? t.slice(0, amt.index) + ' ' + t.slice(amt.index + amt.length) : t;
  const qm = rest.match(RE_QTY);
  let qty = qm ? toNum(qm[1]) : null, unit = qm ? UNIT_ALIAS[qm[2]] : null;
  rest = rest
    .replace(/\d+\s*hari\s*(yang\s*)?lalu/g, ' ')
    .replace(/\b(kemarin|tadi pagi|tadi siang|tadi sore|tadi malam|tadi|barusan|hari ini)\b/g, ' ')
    .replace(/\b\w*(jual|laku|laris|beli|bayar|belanja)\w*\b/g, ' ')
    .replace(/\b(rp|seharga|harga|total|sebesar|senilai|semua|dong|ya|sih|aja|saja)\b/g, ' ')
    .replace(/[,.;:!?]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  let item = rest;
  const q = rest.match(/^(\d+)\s*(porsi|bungkus|bks|gelas|tusuk|pcs|buah|biji|plastik|kg|kilo|liter|lt|bal|pak|dus|tabung)?\s+(.+)$/);
  if (q) {
    item = `${cap(q[3])} (${q[1]}${q[2] ? ' ' + q[2] : ''})`;
    if (!qty) { qty = Number(q[1]); unit = q[2] ? (UNIT_ALIAS[q[2]] || q[2]) : null; }
  }
  else item = cap(rest);
  if (!item) item = type === 'keluar' ? 'Belanja' : type === 'masuk' ? 'Penjualan' : '';

  return {
    type,
    amount: amt ? amt.value : 0,
    item,
    date,
    category: type ? guessCategory(type, t, cats) : null,
    qty, unit,
  };
}

/* =========================================================

   ========================================================= */
const BTN = 'h-12 rounded-xl font-semibold text-base inline-flex items-center justify-center gap-2 transition active:scale-[.98] disabled:opacity-50 disabled:active:scale-100';
const BTN_PRIMARY = `${BTN} bg-blue-600 text-white hover:bg-blue-700 active:bg-blue-800`;
const BTN_SECONDARY = `${BTN} bg-white text-slate-800 border border-slate-300 hover:bg-slate-50`;
const BTN_DANGER = `${BTN} bg-white text-rose-700 border border-rose-300 hover:bg-rose-50`;
const INPUT = 'h-12 w-full rounded-xl border border-slate-300 bg-white px-4 text-base placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500';

function Field({ label, error, hint, children }) {
  return (
    <label className="block">
      <span className="block text-sm font-semibold text-slate-700 mb-1.5">{label}</span>
      {children}
      {error ? <span className="block text-sm text-rose-700 mt-1">{error}</span>
        : hint ? <span className="block text-sm text-slate-500 mt-1">{hint}</span> : null}
    </label>
  );
}

function PasswordInput({ value, onChange, placeholder }) {
  const [show, setShow] = useState(false);
  return (
    <div className="relative">
      <input type={show ? 'text' : 'password'} className={`${INPUT} pr-12`} value={value}
             onChange={e => onChange(e.target.value)} placeholder={placeholder} />
      <button type="button" onClick={() => setShow(s => !s)} aria-label={show ? 'Sembunyikan kata sandi' : 'Lihat kata sandi'}
              className="absolute right-0 top-0 h-12 w-12 grid place-items-center text-slate-500">
        <Icon name={show ? 'eyeOff' : 'eye'} className="w-5 h-5" />
      </button>
    </div>
  );
}

function Chip({ active, onClick, children, className = '' }) {
  return (
    <button type="button" onClick={onClick} aria-pressed={active}
            className={`h-11 px-4 rounded-full text-sm font-semibold whitespace-nowrap border transition ${active
              ? 'bg-blue-600 border-blue-600 text-white' : 'bg-white border-slate-300 text-slate-700 hover:bg-slate-50'} ${className}`}>
      {children}
    </button>
  );
}

function PageHeader({ title, subtitle, onBack, right }) {
  return (
    <header className="sticky top-0 z-20 bg-white/95 backdrop-blur border-b border-slate-200">
      <div className="h-16 px-2 flex items-center gap-1">
        {onBack ? (
          <button onClick={onBack} aria-label="Kembali" className="w-11 h-11 grid place-items-center rounded-full hover:bg-slate-100">
            <Icon name="back" />
          </button>
        ) : <span className="w-2" />}
        <div className="flex-1 min-w-0">
          <h1 className="text-lg font-bold leading-tight truncate">{title}</h1>
          {subtitle && <p className="text-xs text-slate-500 truncate">{subtitle}</p>}
        </div>
        {right}
      </div>

}

function Sheet({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center" role="dialog" aria-modal="true" aria-label={title}>
      <div className="absolute inset-0 bg-slate-900/50" onClick={onClose} />
      <div className="sheet-in relative w-full max-w-[420px] bg-white rounded-t-3xl max-h-[92vh] overflow-y-auto">
        <div className="sticky top-0 z-10 bg-white rounded-t-3xl">
          <div className="mx-auto mt-2 h-1.5 w-10 rounded-full bg-slate-300" />
          <div className="flex items-center justify-between pl-5 pr-2 py-1">

            <button onClick={onClose} aria-label="Tutup" className="w-11 h-11 grid place-items-center rounded-full hover:bg-slate-100">
              <Icon name="x" />
            </button>
          </div>
        </div>
        <div className="px-5 pb-6 pt-1">{children}</div>
      </div>

function ConfirmDialog({ c, onClose }) {
  const [checked, setChecked] = useState(c.checkbox ? c.checkbox.value : false);
  return (
    <div className="fixed inset-0 z-[60] flex items-center justify-center p-5" role="alertdialog" aria-modal="true">

                   onChange={e => setChecked(e.target.checked)} />

                  onClick={() => { c.onConfirm(checked); onClose(); }}>{c.confirmText || 'Ya'}</button>

/* =========================================================
   Form transaksi (popup) — manual, ubah, & ubah hasil bacaan AI
   ========================================================= */
function TxForm({ modal, cats, stock = [], onClose }) {
  const { mode, initial, onSave, onDelete } = modal;
  const [f, setF] = useState(() => {
    const type = initial.type || 'masuk';
    return { type, item: '', amount: 0, date: todayKey(), ...initial, category: initial.category || cats[type][0],
      stock: initial.stock ? { ...initial.stock, qty: String(initial.stock.qty).replace('.', ',') } : null };
  });
  const [err, setErr] = useState({});
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const setType = type => setF(p => ({ ...p, type, category: cats[type].includes(p.category) ? p.category : cats[type][0] }));
  const catList = cats[f.type].includes(f.category) ? cats[f.type] : [...cats[f.type], f.category];
  const title = mode === 'edit' ? 'Ubah transaksi' : mode === 'draft' ? 'Ubah hasil bacaan' : 'Catat manual';
  const t = todayKey();
  // Belanja bahan bisa sekalian menambah stok (tidak untuk mengubah transaksi lama)
  const showStock = mode !== 'edit' && f.type === 'keluar' && stock.length > 0;
  const stockItem = f.stock && stock.find(s => s.id === f.stock.itemId);
  const toggleStock = on => set('stock', on ? { itemId: f.stockMatch || stock[0].id, qty: '' } : null);
  const setStockField = (k, v) => setF(p => ({ ...p, stock: { ...p.stock, [k]: v } }));

  const submit = e => {
    e.preventDefault();
    const er = {};
    if (!f.item.trim()) er.item = 'Isi nama barang atau keterangan dulu.';
    if (!f.amount) er.amount = 'Isi nominalnya dulu.';
    if (!f.date) er.date = 'Pilih tanggalnya.';
    const useStock = showStock && f.stock;
    if (useStock && !toNum(f.stock.qty)) er.stock = 'Isi jumlah yang masuk ke stok.';
    setErr(er);
    if (Object.keys(er).length) return;
    onSave({ ...f, item: f.item.trim(), stock: useStock ? { itemId: f.stock.itemId, qty: toNum(f.stock.qty) } : null });
    onClose();
  };

  return (
    <Sheet title={title} onClose={onClose}>
      <form onSubmit={submit} className="space-y-5">
        <div>
          <span className="block text-sm font-semibold text-slate-700 mb-1.5">Jenis</span>
          <div className="grid grid-cols-2 gap-2" role="radiogroup">
            {[['masuk', '+', 'Uang masuk'], ['keluar', '−', 'Uang keluar']].map(([k, s, l]) => {
              const on = f.type === k;
              const color = k === 'masuk' ? 'border-emerald-600 bg-emerald-50 text-emerald-800' : 'border-rose-600 bg-rose-50 text-rose-800';
              return (
                <button type="button" key={k} role="radio" aria-checked={on} onClick={() => setType(k)}
                        className={`h-14 rounded-xl border-2 font-semibold flex items-center justify-center gap-2 ${on ? color : 'border-slate-200 text-slate-600'}`}>
                  <span className="text-xl font-bold leading-none">{s}</span>{l}
                  {on && <Icon name="check" className="w-5 h-5" />}
                </button>
              );
            })}
          </div>
        </div>

        <Field label="Barang / keterangan" error={err.item}>
          <input className={INPUT} value={f.item} onChange={e => set('item', e.target.value)}
                 placeholder={f.type === 'masuk' ? 'Contoh: Cilok goreng 10 porsi' : 'Contoh: Tepung tapioka 5 kg'} />
        </Field>

        <Field label="Nominal" error={err.amount}>
          <div className="relative">
            <span className="absolute left-4 top-1/2 -translate-y-1/2 font-semibold text-slate-500">Rp</span>
            <input className={`${INPUT} pl-11 text-lg font-bold tabular-nums`} inputMode="numeric" placeholder="0"
                   value={f.amount ? f.amount.toLocaleString('id-ID') : ''}
                   onChange={e => set('amount', Number(e.target.value.replace(/\D/g, '').slice(0, 11)))} />
          </div>
        </Field>

        <div>
          <span className="block text-sm font-semibold text-slate-700 mb-1.5">Kategori</span>
          <div className="flex flex-wrap gap-2">
            {catList.map(c => <Chip key={c} active={f.category === c} onClick={() => set('category', c)}>{c}</Chip>)}
          </div>
        </div>

        <Field label="Tanggal" error={err.date}>
          <div className="flex gap-2 mb-2">
            <Chip active={f.date === t} onClick={() => set('date', t)}>Hari ini</Chip>
            <Chip active={f.date === addDays(t, -1)} onClick={() => set('date', addDays(t, -1))}>Kemarin</Chip>
          </div>
          <input type="date" className={INPUT} value={f.date} max={t} onChange={e => set('date', e.target.value)} />
        </Field>

        {showStock && (
          <div className="rounded-xl border border-slate-200 p-3">
            <label className="flex items-center justify-between gap-3 min-h-[44px] cursor-pointer">
              <span>
                <span className="font-semibold flex items-center gap-1.5"><Icon name="box" className="w-5 h-5 text-blue-700" />Tambah ke stok bahan</span>
                <span className="block text-sm text-slate-500">Untuk belanja bahan yang disimpan</span>
              </span>
              <input type="checkbox" className="w-6 h-6 accent-blue-600 shrink-0" checked={!!f.stock} onChange={e => toggleStock(e.target.checked)} />
            </label>
            {f.stock && (
              <div className="mt-2 grid grid-cols-[1fr_128px] gap-2">
                <select className={INPUT} value={f.stock.itemId} onChange={e => setStockField('itemId', e.target.value)} aria-label="Bahan">
                  {stock.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                </select>
                <div className="relative">
                  <input className={`${INPUT} pr-16 tabular-nums`} inputMode="decimal" placeholder="0" value={f.stock.qty} aria-label="Jumlah masuk stok"
                         onChange={e => setStockField('qty', e.target.value.replace(/[^\d.,]/g, ''))} />
                  <span className="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-slate-500">{stockItem ? stockItem.unit : ''}</span>
                </div>
              </div>
            )}
            {err.stock && <span className="block text-sm text-rose-700 mt-1">{err.stock}</span>}
          </div>
        )}

        <div className={`grid gap-2 pt-1 ${mode === 'edit' ? 'grid-cols-[auto_1fr]' : 'grid-cols-1'}`}>
          {mode === 'edit' && (
            <button type="button" className={`${BTN_DANGER} px-4`} onClick={onDelete}>
              <Icon name="trash" className="w-5 h-5" />Hapus
            </button>
          )}
          <button type="submit" className={BTN_PRIMARY}>
            <Icon name="check" className="w-5 h-5" />Simpan
          </button>
        </div>
      </form>
    </Sheet>
  );
}

/* =========================================================

function BonForm({ modal, debts, onSave, onClose }) {
  const [f, setF] = useState({ name: modal.name || '', desc: '', amount: 0, date: todayKey() });
  const [err, setErr] = useState({});
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const names = debts.map(d => d.name);
  const submit = e => {
    e.preventDefault();
    const er = {};
    if (!f.name.trim()) er.name = 'Isi nama pelanggan.';
    if (!f.amount) er.amount = 'Isi jumlah utangnya.';
    setErr(er);
    if (Object.keys(er).length) return;
    onSave({ ...f, name: f.name.trim(), desc: f.desc.trim() || 'Utang' });
    onClose();
  };
  return (
    <Sheet title={modal.name ? `Tambah utang ${modal.name}` : 'Tambah bon'} onClose={onClose}>
      <form onSubmit={submit} className="space-y-5">
        {!modal.name && (
          <Field label="Nama pelanggan" error={err.name}>
            <input className={INPUT} value={f.name} onChange={e => set('name', e.target.value)} placeholder="Contoh: Bu Sri" />
            {names.length > 0 && (
              <div className="flex gap-2 mt-2 overflow-x-auto no-scrollbar">
                {names.map(n => <Chip key={n} active={f.name.toLowerCase() === n.toLowerCase()} onClick={() => set('name', n)}>{n}</Chip>)}
              </div>
            )}
          </Field>
        )}
        <Field label="Untuk apa" hint="Boleh dikosongkan">
          <input className={INPUT} value={f.desc} onChange={e => set('desc', e.target.value)} placeholder="Contoh: Cilok goreng 3 porsi" />
        </Field>
        <Field label="Jumlah utang" error={err.amount}>
          <div className="relative">
            <span className="absolute left-4 top-1/2 -translate-y-1/2 font-semibold text-slate-500">Rp</span>
            <input className={`${INPUT} pl-11 text-lg font-bold tabular-nums`} inputMode="numeric" placeholder="0"
                   value={f.amount ? f.amount.toLocaleString('id-ID') : ''}
                   onChange={e => set('amount', Number(e.target.value.replace(/\D/g, '').slice(0, 11)))} />
          </div>
        </Field>
        <Field label="Tanggal">
          <input type="date" className={INPUT} value={f.date} max={todayKey()} onChange={e => set('date', e.target.value)} />
        </Field>
        <button type="submit" className={`${BTN_PRIMARY} w-full`}><Icon name="check" className="w-5 h-5" />Simpan bon</button>
      </form>
    </Sheet>
  );
}

const PERIODS = [['hari', 'Hari ini'], ['minggu', 'Minggu ini'], ['bulan', 'Bulan ini']];

function periodRange(p) {
  const t = todayKey();
  if (p === 'hari') return [t, t];
  if (p === 'minggu') return [addDays(t, -6), t];
  return [t.slice(0, 8) + '01', t];
}

function buildBuckets(p, txs) {
  const t = todayKey();
  const sum = list => ({ masuk: sumBy(list, 'masuk'), keluar: sumBy(list, 'keluar') });
  if (p === 'hari') {
    const today = txs.filter(x => x.date === t);
    const h = x => Number(x.time.slice(0, 2));
    return [
      ['Pagi', 'Pagi (sebelum 11.00)', 0, 11], ['Siang', 'Siang (11.00–15.00)', 11, 15],
      ['Sore', 'Sore (15.00–18.00)', 15, 18], ['Malam', 'Malam (setelah 18.00)', 18, 24],
    ].map(([label, long, a, b]) => ({ label, long, ...sum(today.filter(x => h(x) >= a && h(x) < b)) }));
  }
  if (p === 'minggu') {
    return Array.from({ length: 7 }, (_, i) => {
      const k = addDays(t, i - 6);
      return { label: i === 6 ? 'Ini' : HARI[fromKey(k).getDay()], long: relDay(k), ...sum(txs.filter(x => x.date === k)) };
    });
  }
  const d = fromKey(t);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  const out = [];
  for (let s = 1; s <= last; s += 7) {
    const e = Math.min(s + 6, last);
    const a = t.slice(0, 8) + pad(s), b = t.slice(0, 8) + pad(e);
    out.push({ label: `${s}–${e}`, long: `${s}–${e} ${BULAN_PANJANG[d.getMonth()]}`, future: s > d.getDate(), ...sum(txs.filter(x => x.date >= a && x.date <= b)) });
  }
  return out;
}

function currentBucket(p) {
  const d = new Date();
  if (p === 'hari') { const h = d.getHours(); return h < 11 ? 0 : h < 15 ? 1 : h < 18 ? 2 : 3; }
  if (p === 'minggu') return 6;
  return Math.floor((d.getDate() - 1) / 7);
}

function BarChart({ buckets, sel, setSel }) {
  const max = Math.max(1, ...buckets.map(b => Math.max(b.masuk, b.keluar)));
  const h = v => v ? `${Math.max(4, (v / max) * 100)}%` : '0%';
  const b = buckets[sel] || buckets[0];
  return (
    <div>
      <div className="flex items-stretch gap-1 h-40" role="group" aria-label="Grafik uang masuk dan keluar">
        {buckets.map((x, i) => (
          <button key={i} onClick={() => setSel(i)} aria-pressed={sel === i}
                  aria-label={`${x.long}: masuk ${rupiah(x.masuk)}, keluar ${rupiah(x.keluar)}`}
                  className={`flex-1 min-w-0 flex flex-col rounded-xl pt-2 pb-1 transition ${sel === i ? 'bg-blue-50 ring-1 ring-blue-200' : 'hover:bg-slate-50'} ${x.future ? 'opacity-40' : ''}`}>
            <div className="flex-1 min-h-0 flex items-end justify-center gap-1 px-1 border-b border-slate-200">
              <div className="w-1/3 max-w-[14px] rounded-t bg-emerald-500" style={{ height: h(x.masuk) }} />
              <div className="w-1/3 max-w-[14px] rounded-t bg-rose-500" style={{ height: h(x.keluar) }} />
            </div>
            <span className={`mt-1 text-[11px] font-semibold ${sel === i ? 'text-blue-700' : 'text-slate-500'}`}>{x.label}</span>
          </button>
        ))}
      </div>
      <div className="mt-3 rounded-xl bg-slate-50 px-3 py-2.5 text-sm">
        <div className="font-semibold text-slate-700">{b.long}</div>
        <div className="mt-0.5 flex flex-wrap gap-x-4 gap-y-0.5">
          <span className="text-emerald-700 font-semibold">Masuk +{rupiah(b.masuk)}</span>
          <span className="text-rose-700 font-semibold">Keluar −{rupiah(b.keluar)}</span>
        </div>
      </div>
    </div>
  );
}

function receiptImage(r) {
  const total = r.lines.reduce((sum, l) => sum + l.amount, 0);
  const cash = Math.ceil(total / 50000) * 50000;
  const h = 250 + r.lines.length * 34;
  const fmt = n => n.toLocaleString('id-ID');
  const rows = r.lines.map((l, i) => `<text x="20" y="${118 + i * 34}">${l.item}</text><text x="280" y="${118 + i * 34}" text-anchor="end">${fmt(l.amount)}</text>`).join('');
  const y0 = 118 + r.lines.length * 34;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="${h}" viewBox="0 0 300 ${h}"><rect width="300" height="${h}" fill="#fffdf7"/>` +
    `<g font-family="Courier New, monospace" font-size="14" fill="#1f2937">` +
    `<text x="150" y="40" text-anchor="middle" font-weight="bold">${r.store}</text>` +
    `<text x="150" y="62" text-anchor="middle" font-size="12">${fmtDate(todayKey())}</text>` +
    `<line x1="20" y1="84" x2="280" y2="84" stroke="#9ca3af" stroke-dasharray="4 4"/>${rows}` +
    `<line x1="20" y1="${y0 - 8}" x2="280" y2="${y0 - 8}" stroke="#9ca3af" stroke-dasharray="4 4"/>` +
    `<text x="20" y="${y0 + 20}" font-weight="bold">TOTAL</text><text x="280" y="${y0 + 20}" text-anchor="end" font-weight="bold">${fmt(total)}</text>` +
    `<text x="20" y="${y0 + 46}">TUNAI</text><text x="280" y="${y0 + 46}" text-anchor="end">${fmt(cash)}</text>` +
    `<text x="20" y="${y0 + 70}">KEMBALI</text><text x="280" y="${y0 + 70}" text-anchor="end">${fmt(cash - total)}</text>` +
    `<text x="150" y="${h - 18}" text-anchor="middle" font-size="11">Terima kasih</text></g></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* =========================================================
   Pembaca nota (OCR di browser dengan Tesseract.js)
   ========================================================= */
let ocrWorkerPromise = null, ocrOnProgress = null;
function getOcrWorker() {
  if (!window.Tesseract) return Promise.reject(new Error('Pustaka OCR tidak termuat'));
  if (!ocrWorkerPromise) {
    ocrWorkerPromise = Tesseract.createWorker('ind', 1, { logger: m => ocrOnProgress && ocrOnProgress(m) })
      .then(async w => { await w.setParameters({ tessedit_pageseg_mode: '4', preserve_interword_spaces: '1' }); return w; })
      .catch(e => { ocrWorkerPromise = null; throw e; });
  }
  return ocrWorkerPromise;
}

// Perbesar, jadikan abu-abu, dan naikkan kontras supaya tulisan lebih mudah dibaca
function preprocessImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let scale = Math.min(3, Math.max(0.3, 1600 / img.naturalWidth));
      if (img.naturalHeight * scale > 5000) scale = 5000 / img.naturalHeight;
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const d = ctx.getImageData(0, 0, c.width, c.height), px = d.data;
      for (let i = 0; i < px.length; i += 4) {
        let v = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
        v = Math.max(0, Math.min(255, (v - 128) * 1.5 + 128));
        px[i] = px[i + 1] = px[i + 2] = v;
      }
      ctx.putImageData(d, 0, 0);
      resolve(c);
    };
    img.onerror = () => reject(new Error('Foto tidak bisa dibuka'));
    img.src = src;
  });
}

async function readReceipt(src, onProgress) {
  ocrOnProgress = onProgress;
  try {
    const worker = await getOcrWorker();
    const canvas = await preprocessImage(src);
    const { data } = await worker.recognize(canvas);
    return data.text || '';
  } finally { ocrOnProgress = null; }
}

const RECEIPT_SKIP = /(sub\s*total|total|jumlah|tunai|cash|kembali|change|bayar|diskon|disc|potongan|ppn|pajak|tax|debit|kredit|qris|kasir|npwp|telp|struk|terima\s*kasih|member|poin)/i;
const MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, mei: 5, may: 5, jun: 6, jul: 7, agu: 8, ags: 8, aug: 8, sep: 9, okt: 10, oct: 10, nov: 11, des: 12, dec: 12 };

// Harga di ujung baris, termasuk salah baca umum (O jadi 0, l/I jadi 1)
function priceAtEnd(line) {
  const m = line.match(/([0-9OoIl][0-9OoIl.,]{2,})(?:[.,]-)?\s*$/);
  if (!m) return null;
  let raw = m[1].replace(/[Oo]/g, '0').replace(/[Il]/g, '1');
  if (/\d[.,]\d{3}[.,]00$/.test(raw)) raw = raw.slice(0, -3);   // 65.000,00 -> 65.000
  const digits = raw.replace(/\D/g, '');
  const n = Number(digits);
  if (digits.length < 3 || n < 100 || n > 50000000) return null;
  return { value: n, index: m.index };
}

function receiptDate(line) {
  const t = todayKey();
  const ok = (y, mo, d) => {
    if (y < 100) y += 2000;
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    const k = `${y}-${pad(mo)}-${pad(d)}`;
    return k <= t && k >= addDays(t, -365) ? k : null;
  };
  const a = line.match(/\b(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})\b/);
  if (a) return { key: ok(+a[3], +a[2], +a[1]) };
  const b = line.match(/\b(\d{1,2})\s+([a-z]{3})[a-z]*\.?\s+(\d{2,4})\b/i);
  if (b && MONTHS[b[2].toLowerCase()]) return { key: ok(+b[3], MONTHS[b[2].toLowerCase()], +b[1]) };
  return null;
}

function parseReceiptText(text) {
  const rows = text.split('\n').map(l => l.replace(/[|_~`"'*]/g, ' ').replace(/\s+/g, ' ').trim()).filter(Boolean);
  const lines = [];
  let store = null, date = null, total = null, pendingName = null;
  const loose = [];   // angka tanpa label (kadang label TOTAL/TUNAI terbaca terpisah dari angkanya)
  for (const line of rows) {
    const lower = line.toLowerCase();
    const dt = receiptDate(line);
    if (dt) { if (!date && dt.key) date = dt.key; continue; }
    if (/\b\d{1,2}[:.]\d{2}(:\d{2})?\b/.test(line) && !/[a-z]{3}/i.test(line)) continue;   // baris jam
    const price = priceAtEnd(line);
    if (RECEIPT_SKIP.test(lower)) {
      const isLabel = /(total|jumlah|tunai|cash|kembali|change|bayar|diskon|disc|potongan)/.test(lower);
      const value = price ? price.value : isLabel && loose.length ? loose.shift() : null;
      if (value && /\b(total|jumlah)\b/.test(lower) && !/(sub|item|qty|disc)/.test(lower)) total = value;
      if (value && /(diskon|disc|potongan)/.test(lower) && lines.length) {
        const last = lines[lines.length - 1];   // diskon di struk berlaku untuk barang tepat di atasnya
        if (value < last.amount) { last.amount -= value; last.disc = (last.disc || 0) + value; }
      }
      pendingName = null;
      continue;
    }
    const letters = s => (s.match(/[a-z]/gi) || []).length;
    if (!price) {
      if (letters(line) >= 3) { if (!store && !lines.length) store = line; else pendingName = line; }
      continue;
    }
    let rest = line.slice(0, price.index), count = null;
    const qx = rest.match(/(\d+(?:[.,]\d+)?)\s*[xX×]\s*(?:@\s*)?(?:rp\.?\s*)?[\d.,]*/i);
    if (qx) { count = toNum(qx[1]); rest = rest.replace(qx[0], ' '); }
    rest = rest.replace(/@\s*(?:rp\.?\s*)?[\d.,]+/gi, ' ').replace(/^\s*\d{5,}\s*/, ' ').replace(/\brp\.?/gi, ' ');
    let name = rest.replace(/[^A-Za-z0-9 &.,/%()-]/g, ' ').replace(/\s+/g, ' ').trim().replace(/[.,\-]+$/, '');
    if (letters(name) < 3) {
      if (!pendingName) { if (!qx && !letters(line)) loose.push(price.value); continue; }
      name = pendingName;          // nama barang di baris atas, harga di baris bawah (struk minimarket)
    }
    pendingName = null;
    const qm = name.toLowerCase().match(RE_QTY);
    lines.push({ item: cap(name.toLowerCase()), amount: price.value, count,
      size: qm ? toNum(qm[1]) : null, sizeUnit: qm ? UNIT_ALIAS[qm[2]] : null });
  }
  // Satu angka salah baca (mis. 7.000 terbaca 71.000)? Betulkan dari total nota kalau digitnya mirip.
  if (total && lines.length) {
    const sum = lines.reduce((a, l) => a + l.amount, 0);
    const within = (a, b) => { let i = 0; for (const ch of b) if (ch === a[i]) i++; return i === a.length; };
    if (sum !== total) {
      for (const l of lines) {
        const want = total - (sum - l.amount);
        if (want > 0 && (within(String(want), String(l.amount)) || within(String(l.amount), String(want)))) {
          l.read = l.amount; l.amount = want; l.fixed = true;
          break;
        }
      }
    }
  }
  return { store, date, total, lines };
}

function ReceiptCard({ m, stock, onToggle, onEditLine, onAddLine, onSave, onCancel, onUndo, go }) {

            {isIncome ? 'Pemasukan (+)' : 'Pengeluaran (−)'}
          </span>
        </div>
        <div className="text-sm text-slate-500">{m.lines[0] ? relDayFull(m.lines[0].date) + ' · ' : ''}{m.lines.length} barang {m.ai && saved ? 'tersimpan' : 'terbaca'}</div>
      </div>

            ? <p className="text-sm text-emerald-800 mb-2 flex items-center gap-1.5"><Icon name="checkCircle" className="w-4 h-4 shrink-0" />Cocok dengan total di struk ({rupiah(m.total)}).</p>

          <p className="text-xs text-slate-500 mb-2">Sudah langsung tersimpan. Ketuk barang untuk mengubah.</p>
          <div className="grid grid-cols-[auto_1fr] gap-2">
            <button className={`${BTN_SECONDARY} px-4`} onClick={onUndo}>Batalkan</button>
            <button className={BTN_PRIMARY} onClick={() => go('riwayat')}>Lihat di Riwayat</button>
          </div>

      {saved && !m.ai && <button className="w-full h-11 border-t border-slate-100 text-sm font-semibold text-blue-700" onClick={() => go('riwayat')}>Lihat di Riwayat</button>}
    </div>
  );

const SIM_PHRASES = ['jual sepuluh cilok lima puluh ribu', 'beli tepung tapioka lima kilo enam puluh lima ribu',
  'kemarin jual es teh dua puluh gelas enam puluh ribu', 'pakai minyak satu liter', 'bayar gas dua puluh dua ribu'];

function StockCard({ m, item, onSave, onEdit, onCancel, go }) {
  if (!item) return null;
  const pending = m.status === 'pending', saved = m.status === 'saved', cancelled = m.status === 'cancelled';
  const after = saved ? m.after : Math.max(0, item.qty + m.change);
  const Row = ({ label, children }) => (
    <div className="flex justify-between items-center gap-3 py-2"><dt className="text-slate-500">{label}</dt><dd className="font-semibold text-right">{children}</dd></div>
  );
  return (
    <div className={`w-full max-w-[310px] rounded-2xl border bg-white shadow-sm overflow-hidden ${saved ? 'border-blue-300' : 'border-slate-200'} ${cancelled ? 'opacity-60' : ''}`}>
      <div className="px-4 py-2.5 flex items-center justify-between text-sm font-semibold bg-blue-50 text-blue-800">
        <span className="flex items-center gap-1.5"><Icon name="box" className="w-4 h-4" />Stok dipakai</span>
        {saved && <span className="flex items-center gap-1"><Icon name="checkCircle" className="w-4 h-4" />Tersimpan</span>}
        {cancelled && <span className="text-slate-600">Dibatalkan</span>}
      </div>
      <div className="px-4 pt-3">
        <div className="text-xs text-slate-500">Bahan</div>
        <div className="text-lg font-bold">{item.name}</div>
        <dl className="mt-1 text-sm divide-y divide-slate-100">
          <Row label="Dipakai">−{fmtQty(-m.change)} {item.unit}</Row>
          <Row label="Sisa jadi">{fmtQty(after)} {item.unit}</Row>
          <Row label="Status"><StockBadge status={stockStatus({ ...item, qty: after })} /></Row>
        </dl>
        <p className="text-xs text-slate-500 pb-3">Hanya mengurangi stok, tidak dihitung sebagai uang keluar.</p>
      </div>
      {pending && (
        <div className="p-3 pt-0">
          <div className="grid grid-cols-2 gap-2">
            <button className={BTN_SECONDARY} onClick={onEdit}><Icon name="edit" className="w-5 h-5" />Ubah</button>
            <button className={BTN_PRIMARY} onClick={onSave}><Icon name="check" className="w-5 h-5" />Simpan</button>
          </div>
          <button className="w-full h-11 mt-1 text-sm font-semibold text-slate-500" onClick={onCancel}>Batal, bukan ini</button>
        </div>
      )}
      {saved && <button className="w-full h-11 border-t border-slate-100 text-sm font-semibold text-blue-700" onClick={() => go('stok')}>Lihat Stok</button>}
    </div>
  );
}

function Catat({ messages, setMessages, txs, cats, addTx, setTxModal, go, stock, applyStock, setStockModal, biz, openEditTx, mergeScan, undoScan }) {
  const [text, setText] = useState('');
  const endRef = useRef(null);
  const inputRef = useRef(null);
  const [voice, setVoice] = useState(null);          // panel suara: { mode: 'live'|'sim', status, text, error, note }
  const [scanOpen, setScanOpen] = useState(false);
  const recRef = useRef(null);
  const voiceRef = useRef({ text: '', timers: [] });
  const simIdx = useRef(0), scanIdx = useRef(0);

  useEffect(() => { endRef.current && endRef.current.scrollIntoView({ behavior: 'smooth', block: 'end' }); }, [messages.length, messages[messages.length - 1]?.id, !!voice]);
  useEffect(() => () => stopVoice(true), []);

  const patch = (id, p) => setMessages(ms => ms.map(m => m.id === id ? { ...m, ...p } : m));
  const botReply = (msg, delay = 650, label) => {
    const typingId = uid();
    setMessages(ms => [...ms, { id: typingId, from: 'bot', kind: 'typing', label }]);
    setTimeout(() => setMessages(ms => [...ms.filter(m => m.id !== typingId), { id: uid(), from: 'bot', ...msg }]), delay);
  };

  const send = raw => {
    const value = (raw ?? text).trim();
    if (!value) return;
    setText('');
    setMessages(ms => [...ms, { id: uid(), from: 'user', kind: 'text', text: value }]);

    if (/(\bbon\b|utang|hutang|ngutang|kasbon)/i.test(value)) {
      return botReply({ kind: 'text', text: 'Sepertinya ini soal utang pelanggan. Catat di menu Bon supaya tidak tercampur dengan uang masuk.', actions: [{ key: 'bon', label: 'Buka Bon' }] });
    }

    const lower = normalizeNumberWords(value.toLowerCase());
    // Pemakaian bahan: hanya mengurangi stok, bukan transaksi uang
    if (/\b(pakai|terpakai|dipakai|kepakai)\b/.test(lower) && !detectType(lower)) {
      const s = matchStock(lower, stock);
      if (!s) return botReply({ kind: 'text', text: 'Bahan itu belum ada di daftar stok. Tambahkan dulu di halaman Stok, nanti bisa dicatat lewat chat.', actions: [{ key: 'stok', label: 'Buka Stok' }] });
      const qm = lower.match(RE_QTY), num = lower.match(/\d+(?:[.,]\d+)?/);
      const qty = qm ? stockQtyFor(s, toNum(qm[1]), UNIT_ALIAS[qm[2]], null) : num ? toNum(num[0]) : 0;
      if (!qty) return botReply({ kind: 'text', text: `Berapa ${s.unit} ${s.name.toLowerCase()} yang dipakai? Contoh: “pakai ${(s.keywords && s.keywords[0]) || s.name.toLowerCase()} 2 ${s.unit}”.`,
        actions: [{ key: 'stokAdjust', label: 'Isi jumlahnya', itemId: s.id, mode: 'pakai' }] });
      return botReply({ kind: 'stock', status: 'pending', itemId: s.id, change: -qty });
    }
    if (/^(cek\s+)?(stok|stock)\b/.test(lower)) {
      const low = stock.filter(s => stockStatus(s) !== 'aman');
      return botReply({ kind: 'text', actions: [{ key: 'stok', label: 'Buka Stok' }], text: low.length
        ? `Perlu dibeli: ${low.map(s => `${s.name} (sisa ${fmtQty(s.qty)} ${s.unit})`).join(', ')}.`
        : stock.length ? 'Semua stok bahan masih aman.' : 'Daftar stok masih kosong.' });
    }

    const p = parseMessage(value, cats);
    if (p.type && p.amount) {
      const draft = { type: p.type, item: p.item, amount: p.amount, category: p.category, date: p.date };
      if (p.type === 'keluar') {
        const s = matchStock(lower, stock);
        if (s) {
          draft.stockMatch = s.id;
          const q = stockQtyFor(s, p.qty, p.unit, null);
          if (q) draft.stock = { itemId: s.id, qty: q };
        }
      }
      return botReply({ kind: 'card', status: 'pending', draft });
    }
    if (!p.type && p.amount) {
      return botReply({ kind: 'ask', text: `Saya baca nominalnya ${rupiah(p.amount)}. Ini uang masuk atau uang keluar?`, draft: p, answered: null });
    }
    if (p.type && !p.amount) {
      const contoh = p.type === 'masuk' ? 'jual 10 cilok 50rb' : 'beli tepung 65rb';
      return botReply({ kind: 'text', text: `Nominalnya belum ketemu. Coba ulangi dengan harga, misalnya “${contoh}”, atau isi lewat form.`,
        actions: [{ key: 'form', label: 'Isi form manual', draft: { type: p.type, item: p.item, category: p.category, date: p.date } }] });
    }
    botReply({ kind: 'text', text: 'Maaf, saya belum bisa membaca pesan ini. Coba tulis ulang dengan kata “jual”, “beli”, atau “bayar” dan nominalnya. Contoh: “jual 10 cilok 50rb”.',
      actions: [{ key: 'form', label: 'Isi form manual', draft: {} }] });
  };

  const saveDraft = (msgId, draft) => {
    const nt = addTx({ ...draft, source: 'chat' });
    patch(msgId, { status: 'saved', draft });
    let follow;
    if (nt.date === todayKey()) {
      const today = [...txs, nt].filter(x => x.date === todayKey());
      const u = sumBy(today, 'masuk') - sumBy(today, 'keluar');
      follow = `Sip, sudah dicatat. ${u < 0 ? 'Rugi' : 'Untung'} hari ini sekarang ${signedNum(u)}.`;
    } else {
      follow = `Sip, sudah dicatat untuk ${relLower(nt.date)}.`;
    }
    const s = draft.stock && stock.find(x => x.id === draft.stock.itemId);
    if (s) follow += ` Stok ${s.name.toLowerCase()} jadi ${fmtQty(s.qty + draft.stock.qty)} ${s.unit}.`;
    botReply({ kind: 'text', text: follow, actions: [{ key: 'beranda', label: 'Lihat Beranda' }] }, 450);
    // Bahan dikenali tapi jumlahnya tidak disebut: tawarkan tambah stok
    const sm = !draft.stock && draft.type === 'keluar' && draft.stockMatch && stock.find(x => x.id === draft.stockMatch);
    if (sm) setTimeout(() => botReply({ kind: 'text', text: `Mau tambah stok ${sm.name.toLowerCase()} juga? Jumlahnya belum disebut.`,
      actions: [{ key: 'stokAdjust', label: 'Tambah stok', itemId: sm.id, mode: 'tambah' }] }, 450), 700);
  };

  const editDraft = m => setTxModal({ mode: 'draft', initial: m.draft, onSave: f => saveDraft(m.id, f) });

  const answerAsk = (m, type) => {
    patch(m.id, { answered: type });
    setMessages(ms => [...ms, { id: uid(), from: 'user', kind: 'text', text: type === 'masuk' ? 'Uang masuk' : 'Uang keluar' }]);
    const raw = m.draft;
    botReply({ kind: 'card', status: 'pending', draft: {
      type, amount: raw.amount, date: raw.date,
      item: raw.item || (type === 'masuk' ? 'Penjualan' : 'Belanja'), category: guessCategory(type, raw.item.toLowerCase(), cats),
    } }, 450);
  };

  const runAction = a => {
    if (a.key === 'form') setTxModal({ mode: 'new', initial: a.draft || {}, onSave: f => saveDraftNew(f) });
    else if (a.key === 'scan') setScanOpen(true);
    else if (a.key === 'stokAdjust') setStockModal({ type: 'adjust', itemId: a.itemId, mode: a.mode });
    else go(a.key);
  };
  /* ---- Suara ---- */
  const stopVoice = cancel => {
    const v = voiceRef.current;
    v.timers.forEach(clearTimeout); v.timers = [];
    if (cancel) v.cancelled = true;
    if (recRef.current) { try { cancel ? recRef.current.abort() : recRef.current.stop(); } catch (e) { /* sudah berhenti */ } }
  };
  const startSimVoice = note => {
    stopVoice(true);
    const phrase = SIM_PHRASES[simIdx.current++ % SIM_PHRASES.length];
    const words = phrase.split(' ');
    const v = voiceRef.current = { mode: 'sim', text: '', timers: [] };
    setVoice({ mode: 'sim', status: 'listening', text: '', note });
    words.forEach((w, i) => v.timers.push(setTimeout(() => {
      v.text = words.slice(0, i + 1).join(' ');
      setVoice(s => s && { ...s, text: v.text });
    }, 700 + i * 330)));
    v.timers.push(setTimeout(() => finishVoice(), 700 + words.length * 330 + 800));
  };
  const startVoice = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return startSimVoice('Browser ini belum mendukung input suara, jadi ditampilkan simulasi.');
    stopVoice(true);
    const v = voiceRef.current = { mode: 'live', text: '', timers: [] };
    const rec = new SR();
    rec.lang = 'id-ID'; rec.interimResults = true; rec.continuous = false;
    rec.onresult = e => {
      v.text = Array.from(e.results).map(r => r[0].transcript).join(' ');
      setVoice(s => s && { ...s, text: v.text });
    };
    rec.onerror = e => {
      v.failed = true;
      const error = e.error === 'not-allowed' || e.error === 'service-not-allowed'
        ? 'Mikrofon belum diizinkan. Izinkan mikrofon di browser, atau coba simulasi.'
        : e.error === 'no-speech' ? 'Suaranya tidak terdengar. Coba lagi lebih dekat ke HP.'
        : 'Input suara sedang tidak bisa dipakai. Coba lagi, atau pakai simulasi.';
      if (!v.cancelled) setVoice({ mode: 'live', status: 'error', error });
    };
    rec.onend = () => {
      recRef.current = null;
      if (v.failed || v.cancelled) return;
      if (!v.text.trim()) return setVoice({ mode: 'live', status: 'error', error: 'Suaranya tidak terdengar. Coba lagi lebih dekat ke HP.' });
      setVoice(null);
      send(v.text);
    };
    recRef.current = rec;
    setVoice({ mode: 'live', status: 'listening', text: '' });
    try { rec.start(); } catch (e) { startSimVoice('Input suara tidak bisa dimulai, jadi ditampilkan simulasi.'); }
  };
  const finishVoice = () => {
    const v = voiceRef.current;
    if (v.mode === 'live' && recRef.current) { recRef.current.stop(); return; }  // onend yang mengirim
    stopVoice(true);
    setVoice(null);
    if (v.text.trim()) send(v.text);
  };
  const cancelVoice = () => { stopVoice(true); setVoice(null); };

  /* ---- Scan nota ---- */
  const makeLine = (l, date, type = 'keluar') => {
    const line = { id: uid(), type, item: l.item, amount: l.amount, date, include: true, fixed: l.fixed, read: l.read, disc: l.disc,
      category: guessCategory(type, l.item.toLowerCase(), cats) };
    if (type === 'masuk') return line;
    const st = matchStock(l.item, stock);
    const q = st && stockQtyFor(st, l.size, l.sizeUnit, l.count);
    if (st) { line.stockMatch = st.id; if (q) line.stock = { itemId: st.id, qty: q }; }
    return line;
  };
  // Kirim foto ke AI di server. Hasilnya langsung tersimpan; false = AI tidak tersedia, pakai OCR di HP.
  const scanWithAi = async src => {
    const scanId = uid();
    setMessages(ms => [...ms, { id: scanId, from: 'bot', kind: 'scanning', label: 'AI sedang membaca struk…', progress: null }]);
    try {
      const form = new FormData();
      form.append('file', await imageToJpeg(src), 'struk.jpg');
      const r = await api('/scan', { method: 'POST', form });
      setMessages(ms => ms.filter(x => x.id !== scanId));
      mergeScan(r);
      const net = sumBy(r.transactions, 'masuk') - sumBy(r.transactions, 'keluar');
      const stocked = r.stock.map(x => x.name.toLowerCase());
      setMessages(ms => [...ms, { id: uid(), from: 'bot', kind: 'receipt', status: 'saved', ai: true, scanId: r.scanId,
        store: r.store, total: r.total, note: r.note, lines: r.transactions.map(t => ({ ...t, include: true })) }]);
      botReply({ kind: 'text', actions: [{ key: 'beranda', label: 'Lihat Beranda' }],
        text: `Sip, ${r.transactions.length} catatan ${r.kind === 'masuk' ? 'pemasukan' : 'pengeluaran'} dari struk langsung tersimpan (${signedNum(net)}).` +
          (stocked.length ? ` Stok ${stocked.join(', ')} ikut bertambah.` : '') }, 500);
      return true;
    } catch (e) {
      setMessages(ms => ms.filter(x => x.id !== scanId));
      if (['not_receipt', 'bad_image', 'image_too_large', 'ai_refused'].includes(e.code)) {
        botReply({ kind: 'text', text: e.message, actions: [{ key: 'scan', label: 'Foto ulang' }, { key: 'form', label: 'Isi form manual', draft: {} }] }, 300);
        return true;
      }
      setMessages(ms => [...ms, { id: uid(), from: 'bot', kind: 'text', text: `${e.message} Saya baca pakai pembaca nota di HP dulu ya.` }]);
      return false;
    }
  };
  const handleScan = async src => {
    setScanOpen(false);
    if (!src) {
      const r = SAMPLE_RECEIPTS[scanIdx.current++ % SAMPLE_RECEIPTS.length];
      src = receiptImage(r.sale ? { ...r, store: (biz.name || 'Jualans').toUpperCase() } : r);
    }
    setMessages(ms => [...ms, { id: uid(), from: 'user', kind: 'image', src }]);
    if (API.enabled && API.ai && await scanWithAi(src)) return;
    const scanId = uid();
    setMessages(ms => [...ms, { id: scanId, from: 'bot', kind: 'scanning', label: 'Menyiapkan pembaca nota…', progress: 0 }]);
    const onProgress = m => patch(scanId, {
      label: /recogniz/.test(m.status) ? 'Membaca tulisan di nota…' : 'Menyiapkan pembaca nota…',
      progress: Math.round((m.progress || 0) * 100),
    });
    let parsed = null;
    try { parsed = parseReceiptText(await readReceipt(src, onProgress)); } catch (e) { parsed = null; }
    setMessages(ms => ms.filter(x => x.id !== scanId));
    const retry = [{ key: 'scan', label: 'Foto ulang' }, { key: 'form', label: 'Isi form manual', draft: { type: 'keluar' } }];
    if (!parsed) return botReply({ kind: 'text', actions: retry,
      text: 'Pembaca nota belum bisa dipakai. Pastikan HP tersambung internet (dibutuhkan saat pertama kali), lalu coba lagi.' }, 300);
    if (!parsed.lines.length) return botReply({ kind: 'text', actions: retry,
      text: 'Maaf, barang dan harganya belum terbaca jelas. Coba foto ulang di tempat terang, nota diratakan, dan HP tegak lurus di atas nota.' }, 300);
    const date = parsed.date || todayKey();
    // Struk dari usaha sendiri = penjualan (uang masuk); nota dari toko lain = belanja (uang keluar)
    const isSale = !!(parsed.store && biz.name && parsed.store.toLowerCase().includes(biz.name.toLowerCase()));
    botReply({ kind: 'receipt', status: 'pending', store: parsed.store || 'Nota belanja', total: parsed.total,
      lines: parsed.lines.map(l => makeLine(l, date, isSale ? 'masuk' : 'keluar')) }, 300);
  };
  const patchLine = (msgId, lineId, p) => setMessages(ms => ms.map(x => x.id !== msgId ? x
    : { ...x, lines: x.lines.map(l => l.id === lineId ? { ...l, ...(typeof p === 'function' ? p(l) : p) } : l) }));
  const editLine = (m, l) => setTxModal({
    mode: 'draft', initial: { type: l.type, item: l.item, amount: l.amount, category: l.category, date: l.date, stock: l.stock, stockMatch: l.stockMatch },
    onSave: f => patchLine(m.id, l.id, { ...f, include: true, fixed: false }),
  });
  const addLine = m => setTxModal({
    mode: 'draft', initial: { type: 'keluar', date: m.lines[0] ? m.lines[0].date : todayKey() },
    onSave: f => setMessages(ms => ms.map(x => x.id !== m.id ? x : { ...x, lines: [...x.lines, { ...f, id: uid(), include: true }] })),
  });
  const undoAiScan = async m => {
    try {
      const r = await undoScan(m.scanId);
      patch(m.id, { status: 'cancelled' });
      botReply({ kind: 'text', text: `Oke, ${r.deleted.length} catatan dari struk itu sudah dibatalkan.` }, 300);
    } catch (e) {
      botReply({ kind: 'text', text: `Gagal membatalkan: ${e.message}` }, 300);
    }
  };
  const saveReceipt = m => {
    const chosen = m.lines.filter(l => l.include);
    chosen.forEach(l => addTx({ type: l.type, item: l.item, amount: l.amount, category: l.category, date: l.date, stock: l.stock, source: 'scan' }));
    patch(m.id, { status: 'saved' });
    const net = sumBy(chosen, 'masuk') - sumBy(chosen, 'keluar');
    const stocked = chosen.filter(l => l.stock).map(l => (stock.find(x => x.id === l.stock.itemId) || {}).name).filter(Boolean);
    botReply({ kind: 'text', actions: [{ key: 'beranda', label: 'Lihat Beranda' }],
      text: `Sip, ${chosen.length} catatan dari nota sudah disimpan (${signedNum(net)}).` +
        (stocked.length ? ` Stok ${stocked.map(n => n.toLowerCase()).join(', ')} ikut bertambah.` : '') }, 450);
  };

  const markStockSaved = (m, change, r) => {
    patch(m.id, { status: 'saved', change, after: r.qty });
    const st = stockStatus(r);
    botReply({ kind: 'text', text: `Sip, stok ${r.name.toLowerCase()} sisa ${fmtQty(r.qty)} ${r.unit}.` +
      (st === 'habis' ? ' Stoknya sudah habis, waktunya belanja.' : st === 'hampir' ? ' Sudah hampir habis, jangan lupa belanja.' : '') }, 450);
  };
  const saveStockCard = m => {
    const r = applyStock(m.itemId, m.change, 'Dipakai (dari chat)');
    if (r) markStockSaved(m, m.change, r);
  };
  const saveDraftNew = f => {
    const nt = addTx({ ...f, source: 'form' });
    setMessages(ms => [...ms, { id: uid(), from: 'bot', kind: 'card', status: 'saved', draft: { ...f, id: nt.id } }]);
  };

  return (
    <div className="flex flex-col min-h-[calc(100vh-4rem)]">
      <PageHeader title="Catat" subtitle="Ketik, ucapkan, atau foto nota belanja"
        right={
          <button onClick={() => setTxModal({ mode: 'new', initial: {}, onSave: f => saveDraftNew(f) })}
                  className="h-11 px-3 mr-1 rounded-xl text-sm font-semibold text-blue-700 hover:bg-blue-50 flex items-center gap-1.5">
            <Icon name="form" className="w-5 h-5" />Form
          </button>
        } />

      <div className={`flex-1 px-3 pt-4 ${voice ? 'pb-60' : 'pb-40'} space-y-3 bg-slate-50`} aria-live="polite">
        {messages.map(m => {
          if (m.kind === 'image') return (
            <div key={m.id} className="msg-in flex justify-end">
              <div className="rounded-2xl rounded-br-md bg-blue-600 p-1.5">
                <img src={m.src} alt="Foto nota" className="block w-40 max-h-56 object-cover object-top rounded-xl bg-white" />
              </div>
            </div>
          );
          if (m.from === 'user') return (
            <div key={m.id} className="msg-in flex justify-end">
              <div className="max-w-[80%] bg-blue-600 text-white rounded-2xl rounded-br-md px-4 py-2.5 break-words">{m.text}</div>
            </div>
          );
          if (m.kind === 'typing') return (
            <div key={m.id} className="flex"><div className="bg-white border border-slate-200 rounded-2xl rounded-bl-md px-4 py-3 flex items-center gap-1" aria-label={m.label || 'Sedang membaca'}>
              {m.label && <span className="text-sm text-slate-600 mr-2">{m.label}</span>}
              <span className="dot w-2 h-2 rounded-full bg-slate-400" /><span className="dot w-2 h-2 rounded-full bg-slate-400" /><span className="dot w-2 h-2 rounded-full bg-slate-400" />
            </div></div>
          );
          if (m.kind === 'scanning') return (
            <div key={m.id} className="flex">
              <div className="w-[260px] bg-white border border-slate-200 rounded-2xl rounded-bl-md px-4 py-3" role="status">
                <div className="flex items-center justify-between gap-2 text-sm">
                  <span className="font-semibold text-slate-700">{m.label}</span>
                  {m.progress != null && <span className="tabular-nums text-slate-500">{m.progress}%</span>}
                </div>
                <div className="mt-2 h-2 rounded-full bg-slate-100 overflow-hidden">
                  {m.progress != null
                    ? <div className="h-full rounded-full bg-blue-600 transition-all" style={{ width: `${m.progress}%` }} />
                    : <div className="h-full w-1/3 rounded-full bg-blue-600 indeterminate" />}
                </div>
              </div>
            </div>
          );
          if (m.kind === 'receipt') {
            // Hasil AI sudah tersimpan: tampilkan isi terbaru dari daftar transaksi (kalau sempat diubah/dihapus)
            const view = m.ai && m.status === 'saved'
              ? { ...m, lines: m.lines.map(l => txs.find(t => t.id === l.id)).filter(Boolean).map(t => ({ ...t, include: true })) }
              : m;
            return (
              <div key={m.id} className="msg-in flex">
                <ReceiptCard m={view} stock={stock} go={go} onSave={() => saveReceipt(m)} onCancel={() => patch(m.id, { status: 'cancelled' })}
                  onToggle={id => patchLine(m.id, id, l => ({ include: !l.include }))} onAddLine={() => addLine(m)} onUndo={() => undoAiScan(m)}
                  onEditLine={l => m.ai ? openEditTx(txs.find(t => t.id === l.id)) : editLine(m, l)} />
              </div>
            );
          }
          if (m.kind === 'stock') return (
            <div key={m.id} className="msg-in flex">
              <StockCard m={m} item={stock.find(s => s.id === m.itemId)} go={go} onSave={() => saveStockCard(m)}
                onEdit={() => setStockModal({ type: 'adjust', itemId: m.itemId, mode: 'pakai', qty: -m.change, lockMode: true, onDone: (change, r) => markStockSaved(m, change, r) })}
                onCancel={() => patch(m.id, { status: 'cancelled' })} />
            </div>
          );
          if (m.kind === 'card') return (
            <div key={m.id} className="msg-in flex">
              <ConfirmCard m={m} go={go} stock={stock} onSave={() => saveDraft(m.id, m.draft)} onEdit={() => editDraft(m)} onCancel={() => patch(m.id, { status: 'cancelled' })} />
            </div>
          );
          return (
            <div key={m.id} className="msg-in flex flex-col items-start gap-2">
              <div className="max-w-[85%] bg-white border border-slate-200 rounded-2xl rounded-bl-md px-4 py-2.5 text-slate-800">{m.text}</div>
              {m.kind === 'ask' && (
                m.answered ? null : (
                  <div className="flex gap-2">
                    <button onClick={() => answerAsk(m, 'masuk')} className={`${BTN} px-4 bg-emerald-50 border border-emerald-300 text-emerald-800`}><b className="text-lg leading-none">+</b>Uang masuk</button>
                    <button onClick={() => answerAsk(m, 'keluar')} className={`${BTN} px-4 bg-rose-50 border border-rose-300 text-rose-800`}><b className="text-lg leading-none">−</b>Uang keluar</button>
                  </div>
                )
              )}
              {m.actions && (
                <div className="flex flex-wrap gap-2">
                  {m.actions.map(a => (
                    <button key={a.key} onClick={() => runAction(a)} className={`${BTN} h-11 px-4 bg-white border border-blue-200 text-blue-700 text-sm`}>
                      {a.key === 'form' && <Icon name="form" className="w-4 h-4" />}{a.label}
                    </button>
                  ))}
                </div>
              )}
            </div>
          );
        })}
        <div ref={endRef} />
      </div>

      {/* Bilah ketik, menempel di atas menu bawah */}
      <div className="fixed bottom-16 inset-x-0 z-20">
        <div className="mx-auto max-w-[420px] bg-white border-t border-slate-200">
          {voice ? (
            <VoicePanel voice={voice} onDone={finishVoice} onCancel={cancelVoice} onRetry={startVoice} onSim={() => startSimVoice()} />
          ) : (<>
          <div className="flex gap-2 overflow-x-auto no-scrollbar px-3 pt-2">
            {EXAMPLES.map(e => (
              <button key={e} onClick={() => { setText(e); inputRef.current && inputRef.current.focus(); }}
                      className="h-9 px-3 rounded-full bg-slate-100 text-sm text-slate-700 whitespace-nowrap hover:bg-slate-200">{e}</button>
            ))}
          </div>
          <form onSubmit={e => { e.preventDefault(); send(); }} className="flex items-center gap-2 p-3">
            <button type="button" onClick={() => setScanOpen(true)} aria-label="Scan nota pakai kamera"
                    className="shrink-0 w-12 h-12 rounded-full bg-slate-100 text-slate-700 grid place-items-center hover:bg-slate-200">
              <Icon name="camera" />
            </button>
            <input ref={inputRef} value={text} onChange={e => setText(e.target.value)} aria-label="Ketik transaksi"
                   className="h-12 flex-1 min-w-0 rounded-full border border-slate-300 bg-slate-50 px-4 text-base focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                   placeholder="Ketik: jual 3 cilok 15rb" enterKeyHint="send" autoComplete="off" />
            {text.trim() ? (
              <button type="submit" aria-label="Kirim" className="shrink-0 w-12 h-12 rounded-full bg-blue-600 text-white grid place-items-center">
                <Icon name="send" />
              </button>
            ) : (
              <button type="button" onClick={startVoice} aria-label="Catat pakai suara" className="shrink-0 w-12 h-12 rounded-full bg-blue-600 text-white grid place-items-center">
                <Icon name="mic" />
              </button>
            )}
          </form>
          </>)}
        </div>
      </div>
      {scanOpen && <ScanSheet onPick={handleScan} onClose={() => setScanOpen(false)} />}
    </div>
  );
}

/* =========================================================
   RIWAYAT
   ========================================================= */
const DATE_FILTERS = [['semua', '3 bulan'], ['hari', 'Hari ini'], ['7', '7 hari'], ['bulan', 'Bulan ini'], ['pilih', 'Pilih tanggal']];

function Riwayat({ txs, cats, openEditTx, openNewTx, go }) {
  const [q, setQ] = useState('');
  const [df, setDf] = useState('semua');
  const [day, setDay] = useState(todayKey());
  const [cat, setCat] = useState('');
  const t = todayKey();
  const allCats = [...new Set([...cats.masuk, ...cats.keluar, ...txs.map(x => x.category)])];

  const filtered = sortTx(txs).filter(x => {
    if (q && !(`${x.item} ${x.category}`.toLowerCase().includes(q.toLowerCase()))) return false;
    if (cat && x.category !== cat) return false;
    if (x.date < addDays(t, -89)) return false;     // riwayat hanya 3 bulan terakhir
    if (df === 'hari' && x.date !== t) return false;
    if (df === '7' && x.date < addDays(t, -6)) return false;
    if (df === 'bulan' && x.date.slice(0, 7) !== t.slice(0, 7)) return false;
    if (df === 'pilih' && x.date !== day) return false;
    return true;
  });
  const groups = filtered.reduce((acc, x) => { (acc[x.date] = acc[x.date] || []).push(x); return acc; }, {});
  const isFiltered = q || cat || df !== 'semua';
  const reset = () => { setQ(''); setCat(''); setDf('semua'); };

  return (
    <div>
      <PageHeader title="Riwayat" subtitle={`${txs.filter(x => x.date >= addDays(t, -89)).length} transaksi · 3 bulan terakhir`}
        right={
          <button onClick={openNewTx} aria-label="Tambah transaksi manual" className="w-11 h-11 mr-1 rounded-full bg-blue-50 text-blue-700 grid place-items-center hover:bg-blue-100">
            <Icon name="plus" />
          </button>
        } />

      {txs.length === 0 ? (
        <EmptyState icon="list" title="Riwayat masih kosong" text="Semua transaksi yang kamu catat akan muncul di sini."
          action={<button className={`${BTN_PRIMARY} w-full`} onClick={() => go('catat')}><Icon name="chat" className="w-5 h-5" />Mulai catat</button>} />
      ) : (
        <>
          <div className="px-4 pt-3 space-y-2.5 bg-white">
            <div className="relative">
              <Icon name="search" className="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" />
              <input className={`${INPUT} pl-11`} value={q} onChange={e => setQ(e.target.value)} placeholder="Cari barang, misalnya: tepung" aria-label="Cari transaksi" />
            </div>
            <div className="flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4" role="group" aria-label="Filter tanggal">
              {DATE_FILTERS.map(([k, l]) => (
                <Chip key={k} active={df === k} onClick={() => setDf(k)}>
                  {k === 'pilih' && <Icon name="calendar" className="w-4 h-4 inline -mt-0.5 mr-1" />}{l}
                </Chip>
              ))}
            </div>
            {df === 'pilih' && <input type="date" className={INPUT} value={day} max={t} onChange={e => setDay(e.target.value)} aria-label="Pilih tanggal" />}
            <select className={`${INPUT} appearance-none bg-[url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2364748b%22 stroke-width=%222%22><path d=%22m6 9 6 6 6-6%22/></svg>')] bg-no-repeat bg-[length:20px] bg-[right_14px_center]`}
                    value={cat} onChange={e => setCat(e.target.value)} aria-label="Filter kategori">
              <option value="">Semua kategori</option>
              {allCats.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>

          <div className="px-4 py-3 flex items-center justify-between text-sm border-b border-slate-200">
            <span className="text-slate-600">{filtered.length} transaksi</span>
            <span className="flex gap-3 font-semibold tabular-nums">
              <span className="text-emerald-700">+{rupiah(sumBy(filtered, 'masuk'))}</span>
              <span className="text-rose-700">−{rupiah(sumBy(filtered, 'keluar'))}</span>
            </span>
          </div>

          {filtered.length === 0 ? (
            <EmptyState icon="search" title="Tidak ada yang cocok" text="Coba kata lain, atau ubah filter tanggal dan kategori."
              action={isFiltered && <button className={`${BTN_SECONDARY} w-full`} onClick={reset}>Hapus semua filter</button>} />
          ) : (
            Object.entries(groups).map(([date, list]) => {
              const net = sumBy(list, 'masuk') - sumBy(list, 'keluar');
              return (
                <section key={date}>
                  <div className="sticky top-16 z-10 bg-slate-100 px-4 py-2 flex justify-between text-sm">
                    <span className="font-semibold text-slate-700">{relDay(date)}{relDay(date).includes(',') ? '' : `, ${fmtDate(date)}`}</span>
                    <span className={`font-semibold tabular-nums ${net < 0 ? 'text-rose-700' : 'text-emerald-700'}`}>{signedNum(net)}</span>
                  </div>
                  <div className="divide-y divide-slate-100">
                    {list.map(tx => <TxRow key={tx.id} tx={tx} onClick={() => openEditTx(tx)} />)}
                  </div>
                </section>
              );
            })
          )}
          {filtered.length > 0 && <p className="text-center text-xs text-slate-400 py-4">Ketuk transaksi untuk mengubah atau menghapus</p>}
        </>
      )}
    </div>
  );
}

/* =========================================================
   BON
   ========================================================= */
function Bon({ debts, openBon, openAddBon }) {
  const open = debts.filter(d => debtTotal(d) > 0).sort((a, b) => debtTotal(b) - debtTotal(a));
  const lunas = debts.filter(d => debtTotal(d) === 0);
  const total = open.reduce((s, d) => s + debtTotal(d), 0);

  const Item = ({ d }) => {
    const unpaid = d.items.filter(i => !i.paid);
    const lastDate = d.items.map(i => i.date).sort().pop();
    const sum = debtTotal(d);
    return (
      <button onClick={() => openBon(d.id)} className="w-full flex items-center gap-3 px-4 py-3 min-h-[68px] text-left hover:bg-slate-50 active:bg-slate-100">
        <span className={`shrink-0 w-11 h-11 rounded-full grid place-items-center font-bold ${sum ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-500'}`}>
          {d.name.replace(/^(bu|pak|mas|mbak|bang|kak)\s+/i, '').charAt(0).toUpperCase()}
        </span>
        <span className="flex-1 min-w-0">
          <span className="block font-semibold truncate">{d.name}</span>
          <span className="block text-sm text-slate-500 truncate">
            {sum ? `${unpaid.length} catatan · terakhir ${relLower(lastDate)}` : 'Sudah lunas'}
          </span>
        </span>
        <span className={`shrink-0 font-bold tabular-nums ${sum ? '' : 'text-slate-400'}`}>{sum ? rupiah(sum) : 'Lunas'}</span>
        <Icon name="right" className="w-5 h-5 text-slate-400 shrink-0" />
      </button>
    );
  };

  return (
    <div>
      <PageHeader title="Bon pelanggan" subtitle="Catatan pelanggan yang bayar belakangan" />
      {debts.length === 0 ? (
        <EmptyState icon="book" title="Belum ada bon" text="Kalau ada pelanggan yang bayar belakangan, catat di sini supaya tidak lupa."
          action={<button className={`${BTN_PRIMARY} w-full`} onClick={() => openAddBon()}><Icon name="plus" className="w-5 h-5" />Tambah bon</button>} />
      ) : (
        <div className="pb-24">
          <div className="p-4">
            <div className="rounded-2xl bg-amber-50 border border-amber-200 p-4">
              <div className="text-sm text-amber-900">Total belum dibayar</div>
              <div className="text-[30px] leading-tight font-extrabold tabular-nums text-amber-950">{rupiah(total)}</div>
              <div className="text-sm text-amber-900">{open.length ? `dari ${open.length} pelanggan` : 'Semua pelanggan sudah lunas'}</div>
            </div>
          </div>
          {open.length > 0 && (
            <section>
              <h2 className="px-4 pb-1 text-sm font-semibold text-slate-500">Belum lunas</h2>
              <div className="divide-y divide-slate-100 border-y border-slate-100">{open.map(d => <Item key={d.id} d={d} />)}</div>
            </section>
          )}
          {lunas.length > 0 && (
            <section className="mt-5">
              <h2 className="px-4 pb-1 text-sm font-semibold text-slate-500">Sudah lunas</h2>
              <div className="divide-y divide-slate-100 border-y border-slate-100">{lunas.map(d => <Item key={d.id} d={d} />)}</div>
            </section>
          )}
          <div className="fixed bottom-16 inset-x-0 z-20 pointer-events-none">
            <div className="mx-auto max-w-[420px] px-4 pb-3 pt-6 bg-gradient-to-t from-white via-white/90 to-transparent">
              <button className={`${BTN_PRIMARY} w-full pointer-events-auto shadow-lg`} onClick={() => openAddBon()}>
                <Icon name="plus" className="w-5 h-5" />Tambah bon
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function BonDetail({ d, go, openAddBon, askLunas }) {
  if (!d) return null;
  const sum = debtTotal(d);
  const items = [...d.items].sort((a, b) => b.date.localeCompare(a.date));
  const unpaid = items.filter(i => !i.paid), paid = items.filter(i => i.paid);
  return (
    <div className="pb-28">
      <PageHeader title={d.name} subtitle={d.note || 'Pelanggan'} onBack={() => go('bon')} />
      <div className="p-4">
        <div className={`rounded-2xl p-4 ${sum ? 'bg-amber-50 border border-amber-200' : 'bg-emerald-50 border border-emerald-200'}`}>
          <div className="text-sm text-slate-700">{sum ? 'Belum dibayar' : 'Status'}</div>
          <div className="text-[30px] leading-tight font-extrabold tabular-nums">{sum ? rupiah(sum) : 'Lunas'}</div>
          {sum > 0 && <div className="text-sm text-slate-700">{unpaid.length} catatan utang</div>}
        </div>
      </div>

      {unpaid.length > 0 && (
        <section>
          <h2 className="px-4 pb-1 text-sm font-semibold text-slate-500">Rincian utang</h2>
          <div className="divide-y divide-slate-100 border-y border-slate-100">
            {unpaid.map(i => (
              <div key={i.id} className="px-4 py-3 flex justify-between gap-3">
                <div className="min-w-0"><div className="font-semibold">{i.desc}</div><div className="text-sm text-slate-500">{relDayFull(i.date)}</div></div>
                <div className="font-bold tabular-nums">{rupiah(i.amount)}</div>
              </div>
            ))}
          </div>
        </section>
      )}

      {paid.length > 0 && (
        <section className="mt-5">
          <h2 className="px-4 pb-1 text-sm font-semibold text-slate-500">Sudah dibayar</h2>
          <div className="divide-y divide-slate-100 border-y border-slate-100">
            {paid.map(i => (
              <div key={i.id} className="px-4 py-3 flex justify-between gap-3 text-slate-500">
                <div className="min-w-0"><div className="font-semibold">{i.desc}</div><div className="text-sm">{fmtDate(i.date)} · lunas {i.paidDate ? relLower(i.paidDate) : ''}</div></div>
                <div className="tabular-nums line-through">{rupiah(i.amount)}</div>
              </div>
            ))}
          </div>
        </section>
      )}

      <div className="fixed bottom-16 inset-x-0 z-20">
        <div className="mx-auto max-w-[420px] bg-white border-t border-slate-200 p-3 grid grid-cols-2 gap-2">
          <button className={BTN_SECONDARY} onClick={() => openAddBon(d.name)}><Icon name="plus" className="w-5 h-5" />Tambah utang</button>
          <button className={BTN_PRIMARY} disabled={!sum} onClick={() => askLunas(d)}><Icon name="checkCircle" className="w-5 h-5" />Tandai lunas</button>
        </div>
      </div>
    </div>
  );
}

/* =========================================================
   STOK BAHAN
   ========================================================= */
function StockBadge({ status }) {
  const u = STATUS_UI[status];
  return (
    <span className={`inline-flex items-center gap-1 h-6 px-2 rounded-full text-xs font-bold whitespace-nowrap ${u.badge}`}>
      {status !== 'aman' && <Icon name="alert" className="w-3.5 h-3.5" />}{u.label}
    </span>
  );
}

function StockBar({ s }) {
  const pct = Math.min(100, (s.qty / Math.max(s.min * 3, 0.01)) * 100);
  return (
    <div className="h-2 rounded-full bg-slate-100 overflow-hidden" aria-hidden="true">
      <div className={`h-full rounded-full ${STATUS_UI[stockStatus(s)].bar}`} style={{ width: `${s.qty > 0 ? Math.max(pct, 4) : 0}%` }} />
    </div>
  );
}

function Stok({ stock, go, setStockModal }) {
  const sorted = [...stock].sort((a, b) => STATUS_ORDER[stockStatus(a)] - STATUS_ORDER[stockStatus(b)] || a.name.localeCompare(b.name));
  const low = sorted.filter(s => stockStatus(s) !== 'aman');
  const addBtn = (
    <button onClick={() => setStockModal({ type: 'item' })} aria-label="Tambah bahan"
            className="w-11 h-11 mr-1 rounded-full bg-blue-50 text-blue-700 grid place-items-center hover:bg-blue-100"><Icon name="plus" /></button>
  );
  return (
    <div className="pb-6">
      <PageHeader title="Stok bahan" subtitle={`${stock.length} bahan dipantau`} onBack={() => go('beranda')} right={addBtn} />
      {stock.length === 0 ? (
        <EmptyState icon="box" title="Belum ada bahan" text="Tambahkan bahan yang sering dibeli, seperti tepung atau gas. Nanti kamu diingatkan sebelum habis."
          action={<button className={`${BTN_PRIMARY} w-full`} onClick={() => setStockModal({ type: 'item' })}><Icon name="plus" className="w-5 h-5" />Tambah bahan</button>} />
      ) : (
        <>
          <div className="p-4 space-y-3">
            {low.length > 0 ? (
              <div className="rounded-2xl bg-amber-50 border border-amber-200 p-4 flex gap-3">
                <Icon name="alert" className="w-6 h-6 text-amber-700 shrink-0" />
                <div>
                  <div className="font-bold text-amber-950">{low.length} bahan perlu dibeli</div>
                  <div className="text-sm text-amber-900">{low.map(s => s.name).join(', ')}</div>
                </div>
              </div>
            ) : (
              <div className="rounded-2xl bg-blue-50 border border-blue-200 p-4 flex items-center gap-3">
                <Icon name="checkCircle" className="w-6 h-6 text-blue-700 shrink-0" />
                <div className="font-semibold text-blue-950">Semua stok masih aman</div>
              </div>
            )}
            <p className="text-sm text-slate-600">
              Stok bertambah saat kamu mencatat belanja bahan, dan berkurang kalau kamu ketik <b>“pakai tepung 2kg”</b> di Catat.
            </p>
          </div>
          <div className="divide-y divide-slate-100 border-y border-slate-100">
            {sorted.map(s => (
              <button key={s.id} onClick={() => setStockModal({ type: 'detail', itemId: s.id })} className="w-full px-4 py-3.5 text-left hover:bg-slate-50 active:bg-slate-100">
                <div className="flex items-start gap-3">
                  <div className="flex-1 min-w-0">
                    <div className="font-semibold truncate">{s.name}</div>
                    <div className="text-sm text-slate-500">Ingatkan kalau sisa {fmtQty(s.min)} {s.unit}</div>
                  </div>
                  <div className="text-right shrink-0 space-y-1">
                    <div className="font-bold text-lg tabular-nums leading-tight">{fmtQty(s.qty)} <span className="text-sm font-semibold text-slate-500">{s.unit}</span></div>
                    <StockBadge status={stockStatus(s)} />
                  </div>
                </div>
                <div className="mt-2"><StockBar s={s} /></div>
              </button>
            ))}
          </div>
          <p className="text-center text-xs text-slate-400 py-4">Ketuk bahan untuk menambah, memakai, atau mengubah</p>
        </>
      )}
    </div>
  );
}

function StockDetail({ item, onAdjust, onEditInfo, onClose }) {
  return (
    <Sheet title={item.name} onClose={onClose}>
      <div className="rounded-2xl bg-slate-50 p-4">
        <div className="flex items-center justify-between gap-2">
          <span className="text-sm text-slate-600">Sisa stok</span><StockBadge status={stockStatus(item)} />
        </div>
        <div className="text-[32px] leading-tight font-extrabold tabular-nums">{fmtQty(item.qty)} <span className="text-lg font-semibold text-slate-500">{item.unit}</span></div>
        <div className="mt-2"><StockBar s={item} /></div>
        <div className="mt-2 text-sm text-slate-600">Diingatkan kalau sisa {fmtQty(item.min)} {item.unit} atau kurang</div>
      </div>
      <div className="mt-4 grid grid-cols-2 gap-2">
        <button className={BTN_SECONDARY} onClick={() => onAdjust('pakai')}><Icon name="minus" className="w-5 h-5" />Pakai</button>
        <button className={BTN_PRIMARY} onClick={() => onAdjust('tambah')}><Icon name="plus" className="w-5 h-5" />Tambah stok</button>
      </div>
      <h3 className="mt-6 mb-1 text-sm font-semibold text-slate-500">Riwayat stok</h3>
      {item.history.length === 0 ? <p className="text-slate-500 text-sm py-2">Belum ada perubahan.</p> : (
        <div className="divide-y divide-slate-100">
          {item.history.slice(0, 8).map(h => (
            <div key={h.id} className="py-2.5 flex justify-between gap-3">
              <div className="min-w-0">
                <div className="font-semibold truncate">{h.note}</div>
                <div className="text-sm text-slate-500">{relDay(h.date)}, {h.time.replace(':', '.')}</div>
              </div>
