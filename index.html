        </div>
      )}
      <button className={`${BTN_SECONDARY} w-full mt-4`} onClick={onEditInfo}><Icon name="edit" className="w-5 h-5" />Ubah info bahan</button>
    </Sheet>
  );
}

function StockAdjust({ item, mode: initMode, qty: initQty, lockMode, onSave, onClose }) {
  const [mode, setMode] = useState(initMode || 'tambah');
  const [q, setQ] = useState(initQty ? String(initQty).replace('.', ',') : '');
  const [note, setNote] = useState('');
  const [err, setErr] = useState('');
  const n = toNum(q);
  const result = mode === 'tambah' ? item.qty + n : Math.max(0, item.qty - n);
  const quick = ['kg', 'liter'].includes(item.unit) ? [0.5, 1, 2, 5] : [1, 2, 5, 10];
  const submit = e => {
    e.preventDefault();
    if (!n) return setErr('Isi jumlahnya dulu.');
    onSave(mode === 'tambah' ? n : -n, note.trim() || (mode === 'tambah' ? 'Tambah stok' : 'Dipakai'));
    onClose();
  };
  return (
    <Sheet title={mode === 'tambah' ? `Tambah stok ${item.name.toLowerCase()}` : `Pakai ${item.name.toLowerCase()}`} onClose={onClose}>
      <form onSubmit={submit} className="space-y-5">
        {!lockMode && (
          <div className="grid grid-cols-2 gap-2" role="radiogroup">
            {[['tambah', 'plus', 'Tambah stok'], ['pakai', 'minus', 'Pakai']].map(([k, ic, l]) => (
              <button type="button" key={k} role="radio" aria-checked={mode === k} onClick={() => setMode(k)}
                      className={`h-14 rounded-xl border-2 font-semibold flex items-center justify-center gap-2 ${mode === k ? 'border-blue-600 bg-blue-50 text-blue-800' : 'border-slate-200 text-slate-600'}`}>
                <Icon name={ic} className="w-5 h-5" />{l}
              </button>
            ))}
          </div>
        )}
        <div>
          <label className="block text-sm font-semibold text-slate-700 mb-1.5" htmlFor="stok-jumlah">Jumlah ({item.unit})</label>
          <div className="relative">
            <input id="stok-jumlah" className={`${INPUT} pr-20 text-lg font-bold tabular-nums`} inputMode="decimal" placeholder="0" value={q}
                   onChange={e => { setQ(e.target.value.replace(/[^\d.,]/g, '')); setErr(''); }} />
            <span className="absolute right-4 top-1/2 -translate-y-1/2 font-semibold text-slate-500">{item.unit}</span>
          </div>
          {err && <span className="block text-sm text-rose-700 mt-1">{err}</span>}
          <div className="flex gap-2 mt-2">
            {quick.map(v => <Chip key={v} active={n === v} onClick={() => { setQ(String(v).replace('.', ',')); setErr(''); }}>{fmtQty(v)}</Chip>)}
          </div>
        </div>
        <div className="rounded-xl bg-slate-50 p-3 flex items-center justify-between gap-2">
          <span className="text-sm text-slate-600">Stok {fmtQty(item.qty)} → jadi <b className="text-base text-slate-900">{fmtQty(result)} {item.unit}</b></span>
          <StockBadge status={stockStatus({ ...item, qty: result })} />
        </div>
        {mode === 'pakai' && n > item.qty && <p className="-mt-3 text-sm text-amber-800">Lebih banyak dari stok yang tercatat, jadi stok dihitung 0.</p>}
        <Field label="Catatan" hint="Boleh dikosongkan">
          <input className={INPUT} value={note} onChange={e => setNote(e.target.value)} placeholder={mode === 'tambah' ? 'Contoh: beli di pasar' : 'Contoh: untuk adonan pagi'} />
        </Field>
        <button type="submit" className={`${BTN_PRIMARY} w-full`}><Icon name="check" className="w-5 h-5" />Simpan</button>
      </form>
    </Sheet>
  );
}

const UNITS = ['kg', 'liter', 'tabung', 'pak', 'bungkus', 'buah'];

function StockItemForm({ item, onSave, onDelete, onClose }) {
  const [f, setF] = useState({ name: item ? item.name : '', unit: item ? item.unit : 'kg', qty: '', min: item ? String(item.min).replace('.', ',') : '' });
  const [err, setErr] = useState({});
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const num = v => v.replace(/[^\d.,]/g, '');
  const submit = e => {
    e.preventDefault();
    const er = {};
    if (!f.name.trim()) er.name = 'Isi nama bahan.';
    if (!f.unit.trim()) er.unit = 'Isi satuannya.';
    setErr(er);
    if (Object.keys(er).length) return;
    const data = { name: cap(f.name.trim()), unit: f.unit.trim().toLowerCase(), min: toNum(f.min) };
    if (!item) data.qty = toNum(f.qty);
    onSave(data, item && item.id);
    onClose();
  };
  const NumInput = ({ k, label, hint }) => (
    <Field label={label} hint={hint}>
      <div className="relative">
        <input className={`${INPUT} pr-24 tabular-nums`} inputMode="decimal" placeholder="0" value={f[k]} onChange={e => set(k, num(e.target.value))} />
        <span className="absolute right-4 top-1/2 -translate-y-1/2 font-semibold text-slate-500">{f.unit}</span>
      </div>
    </Field>
  );
  return (
    <Sheet title={item ? 'Ubah info bahan' : 'Tambah bahan'} onClose={onClose}>
      <form onSubmit={submit} className="space-y-5">
        <Field label="Nama bahan" error={err.name}>
          <input className={INPUT} value={f.name} onChange={e => set('name', e.target.value)} placeholder="Contoh: Tepung tapioka" />
        </Field>
        <div>
          <span className="block text-sm font-semibold text-slate-700 mb-1.5">Satuan</span>
          <div className="flex flex-wrap gap-2 mb-2">{UNITS.map(u => <Chip key={u} active={f.unit === u} onClick={() => set('unit', u)}>{u}</Chip>)}</div>
          <input className={INPUT} value={f.unit} onChange={e => set('unit', e.target.value)} placeholder="Atau tulis sendiri" aria-label="Satuan" />
          {err.unit && <span className="block text-sm text-rose-700 mt-1">{err.unit}</span>}
        </div>
        {!item && NumInput({ k: 'qty', label: 'Stok sekarang', hint: 'Boleh 0 kalau belum ada' })}
        {NumInput({ k: 'min', label: 'Ingatkan kalau sisa', hint: 'Muncul tanda “Hampir habis” kalau stok sampai di angka ini' })}
        <div className={`grid gap-2 pt-1 ${item ? 'grid-cols-[auto_1fr]' : 'grid-cols-1'}`}>
          {item && <button type="button" className={`${BTN_DANGER} px-4`} onClick={onDelete}><Icon name="trash" className="w-5 h-5" />Hapus</button>}
          <button type="submit" className={BTN_PRIMARY}><Icon name="check" className="w-5 h-5" />Simpan</button>
        </div>
      </form>
    </Sheet>
  );
}

function Pengaturan({ biz, setBiz, user, setUser, cats, setCats, go, onLogout, onClear, onReload, setToast }) {
  const [editing, setEditing] = useState(false);
  const [f, setF] = useState({ name: biz.name, type: biz.type, owner: user.name });
  const [newCat, setNewCat] = useState({ masuk: '', keluar: '' });

  const saveProfile = () => {
    setBiz({ name: f.name.trim() || biz.name, type: f.type.trim() || biz.type });
    setUser({ ...user, name: f.owner.trim() || user.name });
    setEditing(false);
    setToast('Profil usaha disimpan');
  };
  const addCat = type => {
    const v = newCat[type].trim();
    if (!v) return;
    if (cats[type].some(c => c.toLowerCase() === v.toLowerCase())) return setToast('Kategori itu sudah ada');
    setCats({ ...cats, [type]: [...cats[type], cap(v)] });
    setNewCat({ ...newCat, [type]: '' });
  };
  const removeCat = (type, c) => {
    if (cats[type].length <= 1) return setToast('Minimal harus ada satu kategori');
    setCats({ ...cats, [type]: cats[type].filter(x => x !== c) });
  };

  return (
    <div className="pb-6">
      <PageHeader title="Pengaturan" onBack={() => go('beranda')} />

      <section className="p-4">
        <h2 className="text-sm font-semibold text-slate-500 mb-2">Profil usaha</h2>
        <div className="rounded-2xl border border-slate-200 p-4">
          {!editing ? (
            <>
              <div className="flex items-center gap-3">
                <span className="w-12 h-12 rounded-xl bg-blue-50 text-blue-700 grid place-items-center"><Icon name="store" /></span>
                <div className="min-w-0 flex-1">
                  <div className="font-bold text-lg truncate">{biz.name}</div>
                  <div className="text-slate-600 text-sm truncate">{biz.type}</div>
                </div>
              </div>
              <dl className="mt-3 text-sm divide-y divide-slate-100">
                <div className="flex justify-between py-2"><dt className="text-slate-500">Pemilik</dt><dd className="font-semibold">{user.name}</dd></div>
                <div className="flex justify-between py-2"><dt className="text-slate-500">Nomor HP / email</dt><dd className="font-semibold">{user.contact}</dd></div>
              </dl>
              <button className={`${BTN_SECONDARY} w-full mt-2`} onClick={() => { setF({ name: biz.name, type: biz.type, owner: user.name }); setEditing(true); }}>
                <Icon name="edit" className="w-5 h-5" />Ubah profil
              </button>
            </>
          ) : (
            <div className="space-y-4">
              <Field label="Nama usaha"><input className={INPUT} value={f.name} onChange={e => setF({ ...f, name: e.target.value })} /></Field>
              <Field label="Jenis usaha"><input className={INPUT} value={f.type} onChange={e => setF({ ...f, type: e.target.value })} list="jenis-usaha" /></Field>
              <datalist id="jenis-usaha">{BIZ_TYPES.filter(t => t !== 'Lainnya').map(t => <option key={t} value={t} />)}</datalist>
              <Field label="Nama pemilik"><input className={INPUT} value={f.owner} onChange={e => setF({ ...f, owner: e.target.value })} /></Field>
              <div className="grid grid-cols-2 gap-2">
                <button className={BTN_SECONDARY} onClick={() => setEditing(false)}>Batal</button>
                <button className={BTN_PRIMARY} onClick={saveProfile}>Simpan</button>
              </div>
            </div>
          )}
        </div>
      </section>

      <section className="px-4 pb-4">
        <h2 className="text-sm font-semibold text-slate-500 mb-2">Daftar kategori</h2>
        <div className="rounded-2xl border border-slate-200 divide-y divide-slate-100">
          {[['masuk', 'Untuk uang masuk (+)', 'text-emerald-700'], ['keluar', 'Untuk uang keluar (−)', 'text-rose-700']].map(([type, label, color]) => (
            <div key={type} className="p-4">
              <div className={`font-semibold ${color}`}>{label}</div>
              <div className="mt-2 flex flex-wrap gap-2">
                {cats[type].map(c => (
                  <span key={c} className="h-11 pl-4 pr-1 rounded-full bg-slate-100 text-sm font-semibold text-slate-700 flex items-center gap-1">
                    {c}
                    <button onClick={() => removeCat(type, c)} aria-label={`Hapus kategori ${c}`} className="w-9 h-9 grid place-items-center rounded-full hover:bg-slate-200 text-slate-500">
                      <Icon name="x" className="w-4 h-4" />
                    </button>
                  </span>
                ))}
              </div>
              <form className="mt-3 flex gap-2" onSubmit={e => { e.preventDefault(); addCat(type); }}>
                <input className={INPUT} value={newCat[type]} onChange={e => setNewCat({ ...newCat, [type]: e.target.value })} placeholder="Kategori baru" aria-label={`Kategori baru ${label}`} />
                <button type="submit" className={`${BTN_SECONDARY} px-4 shrink-0`}><Icon name="plus" className="w-5 h-5" />Tambah</button>
              </form>
            </div>
          ))}
        </div>
      </section>

      <section className="px-4 pb-4">
        <h2 className="text-sm font-semibold text-slate-500 mb-2">Data contoh (khusus prototipe)</h2>
        <div className="rounded-2xl border border-slate-200 p-4 space-y-2">
          <p className="text-sm text-slate-600">Kosongkan data untuk melihat tampilan saat belum ada catatan.</p>
          <div className="grid grid-cols-2 gap-2">
            <button className={BTN_SECONDARY} onClick={onClear}><Icon name="trash" className="w-5 h-5" />Kosongkan</button>

          </div>
        </div>
      </section>

      <div className="px-4">
        <button className={`${BTN_DANGER} w-full`} onClick={onLogout}><Icon name="logout" className="w-5 h-5" />Keluar dari akun</button>
        <p className="text-center text-xs text-slate-400 mt-4">Jualans · prototipe v0.1</p>
      </div>
    </div>
  );

/* =========================================================
   Aplikasi setelah login
   ========================================================= */
function MainApp(props) {
  const { user, setUser, biz, setBiz, txs, setTxs, debts, setDebts, cats, setCats, stock, setStock, onLogout, setToast, applyBootstrap } = props;
  const [page, setPage] = useState('beranda');
  const [bonId, setBonId] = useState(null);
  const [txModal, setTxModal] = useState(null);
  const [bonModal, setBonModal] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [stockModal, setStockModal] = useState(null);
  const [messages, setMessages] = useState(initialMessages);

  const go = p => { setPage(p); window.scrollTo(0, 0); };

  // Tampilan diperbarui langsung; kalau tersambung ke server, perubahan ikut dikirim ke database
  const remote = (path, opts) => !API.enabled ? Promise.resolve(null)
    : api(path, opts).catch(e => { setToast({ warn: true, text: `Belum tersimpan ke server: ${e.message}` }); return null; });

  // Ubah stok satu bahan; beri peringatan kalau baru saja jadi hampir habis / habis
  const applyStock = (itemId, change, note, date = todayKey(), push = true) => {
    const s = stock.find(x => x.id === itemId);
    if (!s) return null;
    const round = v => Math.max(0, Math.round(v * 100) / 100);
    const entry = { id: uid(), date, time: nowTime(), change, note };
    setStock(list => list.map(x => x.id === itemId ? { ...x, qty: round(x.qty + change), history: [entry, ...x.history] } : x));
    const r = { ...s, qty: round(s.qty + change) };
    if (push) remote(`/stock/${itemId}/adjust`, { method: 'POST', body: { change, note, date } });
    const before = stockStatus(s), after = stockStatus(r);
    if (after !== before && after !== 'aman') {
      setTimeout(() => setToast({ warn: true, text: after === 'habis'
        ? `Stok ${s.name.toLowerCase()} habis. Waktunya belanja!`
        : `Stok ${s.name.toLowerCase()} tinggal ${fmtQty(r.qty)} ${s.unit}, hampir habis.` }), 1200);
    }
    return r;
  };
  const saveStockItem = (data, id) => {
    if (id) {
      setStock(list => list.map(s => s.id === id ? { ...s, ...data, keywords: data.name !== s.name ? stockKeywords(data.name) : s.keywords } : s));
      remote(`/stock/${id}`, { method: 'PUT', body: { name: data.name, unit: data.unit, min: data.min } });
      setToast('Info bahan disimpan');
    } else {
      const newId = uid();
      const history = data.qty ? [{ id: uid(), date: todayKey(), time: nowTime(), change: data.qty, note: 'Stok awal' }] : [];
      setStock(list => [...list, { id: newId, ...data, keywords: stockKeywords(data.name), history }]);
      remote('/stock', { method: 'POST', body: { id: newId, ...data } });
      setToast(`${data.name} ditambahkan ke stok`);
    }
  };
  const askDeleteStock = item => setConfirm({
    title: `Hapus ${item.name}?`, danger: true, confirmText: 'Hapus',
    message: 'Bahan ini dan riwayat stoknya akan dihapus dari daftar.',
    onConfirm: () => { setStock(l => l.filter(s => s.id !== item.id)); remote(`/stock/${item.id}`, { method: 'DELETE' }); setStockModal(null); setToast('Bahan dihapus'); },
  });

  const addTx = (tx, push = true) => {
    const nt = { ...tx, id: uid(), time: tx.time || nowTime() };
    setTxs(p => [nt, ...p]);
    const withStock = tx.stock && tx.stock.qty > 0;
    if (withStock) applyStock(tx.stock.itemId, tx.stock.qty, `Belanja: ${tx.item}`, tx.date, false);
    if (push) remote('/transactions', { method: 'POST', body: {
      id: nt.id, type: nt.type, item: nt.item, amount: nt.amount, category: nt.category, date: nt.date, time: nt.time,
      source: tx.source || 'manual', stock: withStock ? { itemId: tx.stock.itemId, qty: tx.stock.qty } : null } });
    return nt;
  };
  // Hasil scan AI sudah disimpan server: cukup masukkan ke tampilan
  const mergeScan = r => {
    setTxs(p => [...r.transactions, ...p]);
    if (r.stock.length) setStock(list => list.map(s => r.stock.find(x => x.id === s.id) || s));
  };
  const undoScan = async scanId => {
    const r = await api(`/scans/${scanId}`, { method: 'DELETE' });
    setTxs(p => p.filter(t => !r.deleted.includes(t.id)));
    if (r.stock.length) setStock(list => list.map(s => r.stock.find(x => x.id === s.id) || s));
    return r;
  };
  const openNewTx = () => setTxModal({ mode: 'new', initial: {}, onSave: f => { const nt = addTx({ ...f, source: 'form' }); setToast(`Tersimpan ${signed(nt.type, nt.amount)}`); } });
  const openEditTx = tx => setTxModal({
    mode: 'edit', initial: tx,
    onSave: f => {
      setTxs(p => p.map(x => x.id === tx.id ? { ...x, ...f } : x));
      remote(`/transactions/${tx.id}`, { method: 'PUT', body: { type: f.type, item: f.item, amount: f.amount, category: f.category, date: f.date } });
      setToast('Perubahan disimpan');
    },
    onDelete: () => setConfirm({
      title: 'Hapus transaksi ini?', danger: true, confirmText: 'Hapus',
      message: `${tx.item} (${signed(tx.type, tx.amount)}) akan dihapus dan tidak bisa dikembalikan.`,
      onConfirm: () => { setTxs(p => p.filter(x => x.id !== tx.id)); remote(`/transactions/${tx.id}`, { method: 'DELETE' }); setTxModal(null); setToast('Transaksi dihapus'); },
    }),
  });

  const saveBon = ({ name, desc, amount, date }) => {
    const item = { id: uid(), desc, amount, date, paid: false };
    const ex = debts.find(d => d.name.toLowerCase() === name.toLowerCase());
    const customerId = ex ? ex.id : uid();
    setDebts(list => ex ? list.map(d => d.id === ex.id ? { ...d, items: [...d.items, item] } : d)
      : [...list, { id: customerId, name, note: 'Pelanggan', items: [item] }]);
    remote('/debts', { method: 'POST', body: { name, desc, amount, date, itemId: item.id, customerId } });
    setToast(`Bon ${name} ${rupiah(amount)} dicatat`);
  };

  const askLunas = d => {
    const sum = debtTotal(d);
    setConfirm({
      title: `Tandai lunas?`,
      message: `Semua utang ${d.name} sebesar ${rupiah(sum)} akan ditandai sudah dibayar.`,
      confirmText: 'Ya, lunas',
      checkbox: { label: `Catat juga ${rupiah(sum)} sebagai uang masuk hari ini`, value: true },
      onConfirm: record => {
        const t = todayKey();
        setDebts(list => list.map(x => x.id === d.id ? { ...x, items: x.items.map(i => i.paid ? i : { ...i, paid: true, paidDate: t }) } : x));
        const nt = record ? addTx({ type: 'masuk', item: `Pelunasan bon ${d.name}`, amount: sum, category: cats.masuk.includes('Pelunasan bon') ? 'Pelunasan bon' : cats.masuk[0], date: t }, false) : null;
        remote(`/customers/${d.id}/settle`, { method: 'POST', body: { recordIncome: record, txId: nt ? nt.id : null } });
        setToast(`Bon ${d.name} lunas${record ? ` · +${rupiah(sum)}` : ''}`);
      },
    });
  };

  const currentDebt = debts.find(d => d.id === bonId);

  return (
    <div className="mx-auto max-w-[420px] min-h-screen bg-white pb-16 sm:shadow-xl sm:shadow-slate-300/40">
      {page === 'beranda' && <Beranda biz={biz} user={user} txs={txs} debts={debts} stock={stock} go={go} openEditTx={openEditTx} openNewTx={openNewTx} />}
      {page === 'catat' && <Catat messages={messages} setMessages={setMessages} txs={txs} cats={cats} addTx={addTx} setTxModal={setTxModal} go={go}
                                  stock={stock} applyStock={applyStock} setStockModal={setStockModal} biz={biz} openEditTx={openEditTx}
                                  mergeScan={mergeScan} undoScan={undoScan} />}
      {page === 'stok' && <Stok stock={stock} go={go} setStockModal={setStockModal} />}
      {page === 'riwayat' && <Riwayat txs={txs} cats={cats} openEditTx={openEditTx} openNewTx={openNewTx} go={go} />}
      {page === 'bon' && <Bon debts={debts} openBon={id => { setBonId(id); go('bonDetail'); }} openAddBon={() => setBonModal({})} />}
      {page === 'bonDetail' && <BonDetail d={currentDebt} go={go} openAddBon={name => setBonModal({ name })} askLunas={askLunas} />}
      {page === 'pengaturan' && (
        <Pengaturan biz={biz} go={go} setToast={setToast} user={user} cats={cats}
          setBiz={b => { setBiz(b); remote('/me', { method: 'PUT', body: { business_name: b.name, business_type: b.type } }); }}
          setUser={u => { setUser(u); remote('/me', { method: 'PUT', body: { name: u.name } }); }}
          setCats={c => { setCats(c); remote('/categories', { method: 'PUT', body: c }); }}
          onLogout={() => setConfirm({ title: 'Keluar dari akun?', message: 'Kamu bisa login lagi kapan saja.', confirmText: 'Keluar', danger: true, onConfirm: onLogout })}
          onClear={() => setConfirm({ title: 'Kosongkan semua data?', message: 'Semua transaksi, bon, dan stok contoh akan dihapus.', confirmText: 'Kosongkan', danger: true,
            onConfirm: () => {
              if (API.enabled) return remote('/demo/reset', { method: 'POST', body: { mode: 'empty' } }).then(d => { if (d) { applyBootstrap(d); setToast('Data dikosongkan'); } });
              setTxs([]); setDebts([]); setStock([]); setToast('Data dikosongkan');
            } })}
          onReload={() => {
            if (API.enabled) return remote('/demo/reset', { method: 'POST', body: { mode: 'sample' } }).then(d => { if (d) { applyBootstrap(d); setToast('Data contoh 3 bulan diisi ulang'); } });
            setTxs(makeSampleTx()); setDebts(makeSampleDebts()); setStock(makeSampleStock()); setToast('Data contoh diisi ulang');
          }} />
      )}

      <BottomNav page={page} go={go} />

      {txModal && <TxForm key={JSON.stringify(txModal.initial)} modal={txModal} cats={cats} stock={stock} onClose={() => setTxModal(null)} />}
      {bonModal && <BonForm modal={bonModal} debts={debts} onSave={saveBon} onClose={() => setBonModal(null)} />}
      {stockModal && (() => {
        const item = stock.find(s => s.id === stockModal.itemId);
        const backToDetail = () => setStockModal(item ? { type: 'detail', itemId: item.id } : null);
        if (stockModal.type === 'item') {
          return <StockItemForm key={stockModal.itemId || 'baru'} item={item} onSave={saveStockItem} onClose={backToDetail} onDelete={() => askDeleteStock(item)} />;
        }
        if (!item) return null;
        if (stockModal.type === 'detail') {
          return <StockDetail item={item} onClose={() => setStockModal(null)}
                   onAdjust={mode => setStockModal({ type: 'adjust', itemId: item.id, mode, back: true })}
                   onEditInfo={() => setStockModal({ type: 'item', itemId: item.id })} />;
        }
        return <StockAdjust key={item.id + stockModal.mode} item={item} mode={stockModal.mode} qty={stockModal.qty} lockMode={stockModal.lockMode}
                 onClose={() => stockModal.back ? backToDetail() : setStockModal(null)}
                 onSave={(change, note) => {
                   const r = applyStock(item.id, change, note);
                   setToast(`Stok ${item.name.toLowerCase()} jadi ${fmtQty(r.qty)} ${item.unit}`);
                   if (stockModal.onDone) stockModal.onDone(change, r);
                 }} />;
      })()}
      {confirm && <ConfirmDialog c={confirm} onClose={() => setConfirm(null)} />}
    </div>
  );
}

/* =========================================================
   Akar aplikasi
   ========================================================= */
function App() {
  const [screen, setScreen] = useState('loading'); // loading | landing | daftar | setup | login | app
  const [user, setUser] = useState({ name: 'Rina', contact: '0812-3456-7890' });
  const [biz, setBiz] = useState({ name: 'Jualans', type: 'Cilok goreng' });
  const [txs, setTxs] = useState(makeSampleTx);
  const [debts, setDebts] = useState(makeSampleDebts);
  const [cats, setCats] = useState(DEFAULT_CATS);
  const [stock, setStock] = useState(makeSampleStock);
  const [toast, setToast] = useState(null);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 2400);
    return () => clearTimeout(t);
  }, [toast]);

  const go = s => { setScreen(s); window.scrollTo(0, 0); };

  const applyBootstrap = d => {
    setUser(d.user);
    setBiz({ name: d.business.name, type: d.business.type });
    setTxs(d.transactions); setDebts(d.customers); setCats(d.categories); setStock(d.stock);
  };
  const onAuth = d => {
    API.token = d.token;
    storage.set('jualans_token', d.token);
    applyBootstrap(d);
    go(d.business.setupDone ? 'app' : 'setup');
  };
  const logout = () => {
    if (API.enabled) {
      api('/auth/logout', { method: 'POST' }).catch(() => {});
      API.token = null;
      storage.set('jualans_token', null);
    }
    go('landing');
  };

  // Saat dibuka: cari backend, lalu lanjutkan sesi login yang tersimpan
  useEffect(() => {
    (async () => {
      if (await detectBackend()) {
        const saved = storage.get('jualans_token');
        if (saved) {
          API.token = saved;
          try {
            const d = await api('/bootstrap');
            applyBootstrap(d);
            return setScreen(d.business.setupDone ? 'app' : 'setup');
          } catch (e) { API.token = null; storage.set('jualans_token', null); }
        }
      }
      setScreen('landing');
    })();
  }, []);

  return (
    <>
      {screen === 'loading' && (
        <div className="min-h-screen grid place-items-center" role="status">
          <div className="flex flex-col items-center gap-3 text-slate-500"><Logo size="lg" />Memuat…</div>
        </div>
      )}
      {screen === 'landing' && <Landing go={go} />}
      {screen === 'daftar' && <Register go={go} setUser={setUser} onAuth={onAuth} />}
      {screen === 'setup' && <Setup biz={biz} setBiz={setBiz} user={user} onDone={() => go('app')} />}
      {screen === 'login' && <Login go={go} onLogin={() => go('app')} onAuth={onAuth} setToast={setToast} />}
      {screen === 'app' && (
        <MainApp user={user} setUser={setUser} biz={biz} setBiz={setBiz} txs={txs} setTxs={setTxs}
                 debts={debts} setDebts={setDebts} cats={cats} setCats={setCats} stock={stock} setStock={setStock} setToast={setToast}
                 applyBootstrap={applyBootstrap} onLogout={logout} />
      )}
      {toast && <Toast text={toast} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
